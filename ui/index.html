<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>악보함</title>
<style>
:root{--bg:#101114;--panel:#0d1117;--panel2:#0b0f14;--card:#141a22;--card2:#182130;--line:#26303d;--line2:#1c2430;--ink:#e9ecf1;--ink2:#c9d0da;--strong:#f4e7c8;--muted:#9aa3b2;--faint:#6f7a8a;--faint2:#4b5665;--gold:#e2b866;--gold2:#c9a962;--golddim:#a8833f;--goldline:#6b5426;--green:#5fc7a4;--pink:#e88aa6;--blue:#7aa2e8;--ok:#4ade80;--mono:ui-monospace,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 "IBM Plex Sans KR","Pretendard","Malgun Gothic",system-ui,sans-serif;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto}
*::-webkit-scrollbar{width:10px;height:10px}*::-webkit-scrollbar-track{background:transparent}*::-webkit-scrollbar-thumb{background:#26303d;border-radius:8px;border:3px solid transparent;background-clip:padding-box}*::-webkit-scrollbar-thumb:hover{background:#3a4756;background-clip:padding-box;border:3px solid transparent}
button{font:inherit;color:var(--ink2);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
button:hover{background:var(--card2);color:var(--strong)}
button.pri{background:var(--gold);color:#1a1608;border-color:transparent;font-weight:600}button.pri:hover{background:#efc879}
button.out{border-color:var(--goldline);color:var(--gold)}
button.ghost{border-color:transparent;color:var(--muted)}
button.small{padding:3px 8px;font-size:12px;border-radius:6px}
button.ic{width:30px;height:30px;padding:0;justify-content:center}
button.ic.dim{color:var(--faint)}
button.tb{width:34px;height:34px;padding:0;justify-content:center;border-radius:8px}
button.tb.big{width:44px;height:44px;border-radius:11px;background:var(--gold);color:#1a1608;border-color:transparent}button.tb.big:hover{background:#efc879}
button.tb.on{border-color:var(--goldline);color:var(--gold)}
button:disabled{opacity:.4;cursor:default}
input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
input:focus,textarea:focus{outline:none;border-color:var(--goldline)}
input[type=checkbox]{width:14px;height:14px;accent-color:var(--gold);margin:0}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
svg.i.s{width:14px;height:14px;stroke-width:1.8}svg.i.l{width:20px;height:20px}
.top{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line2);background:var(--panel)}
.brand{display:flex;flex-direction:column;line-height:1.05;margin-right:6px}.brand small{font-size:9.5px;letter-spacing:.16em;color:var(--golddim)}.brand b{font-size:16px}
.grow{flex:1}
.status{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}.dot.on{background:var(--ok);box-shadow:0 0 7px var(--ok)}.dot.off{background:var(--pink)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:250px 1fr 320px;gap:12px;padding:12px 16px;min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.chd{display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid var(--line2);font-weight:600;flex-wrap:wrap}
.chd .m{font-size:12px;color:var(--muted);font-weight:400}
.cbd{padding:10px 12px;overflow:auto;min-height:0;flex:1}
.sec{font-size:11px;letter-spacing:.1em;color:var(--gold2);margin:8px 0 3px;display:flex;align-items:center;gap:6px;padding:0 4px}
.sec .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:0}
.tree .it{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--ink2)}
.tree .it:hover{background:#1a2230}.tree .it.on{background:var(--card2);color:var(--strong);font-weight:600}
.tree .it .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tree .it .cnt{font-family:var(--mono);font-size:11px;color:var(--faint)}.tree .it.on .cnt{color:var(--gold)}
.tree .sub{margin-left:12px;border-left:1px solid var(--line2);padding-left:5px}
.tree .it.auto{color:var(--muted)}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden;font-size:12px}
.seg span{padding:4px 10px;color:var(--muted);cursor:pointer;white-space:nowrap}.seg span:hover{color:var(--ink2)}.seg span.on{background:var(--gold);color:#1a1608;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:7px;border:1px solid var(--line);color:var(--muted);cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--ink2)}.chip.on{border-color:var(--goldline);color:var(--strong);background:rgba(226,184,102,.1)}
.idx{display:flex;flex-wrap:wrap;gap:2px}.idx span{font-family:var(--mono);font-size:11px;padding:2px 5px;border-radius:5px;color:var(--muted);cursor:pointer}.idx span:hover{color:var(--ink2)}.idx span.on{background:var(--gold);color:#1a1608;font-weight:600}.idx span.zero{opacity:.3;cursor:default}
.badge{font-size:10.5px;padding:1px 6px;border-radius:4px;font-weight:600;white-space:nowrap;margin-left:6px}
.badge.dup{background:rgba(232,138,166,.16);color:var(--pink)}.badge.play{background:rgba(226,184,102,.16);color:var(--gold)}.badge.man{border:1px solid var(--line);color:var(--muted);font-weight:500}.badge.tag{background:rgba(122,162,232,.14);color:var(--blue)}.badge.var{background:rgba(95,199,164,.14);color:var(--green)}.badge.eq{background:rgba(95,199,164,.14);color:var(--green);font-weight:500}
.row{display:grid;grid-template-columns:16px 22px 1fr 140px 48px auto;gap:10px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line2);cursor:default}
.row.pl{grid-template-columns:14px 16px 22px 1fr 130px 132px 48px auto}
.row:hover{background:#1a2230}.row.sel{background:rgba(226,184,102,.07)}
.row .no{font-family:var(--mono);font-size:11px;color:var(--faint)}
.row .ttl{display:flex;flex-direction:column;gap:1px;min-width:0}
.row .ttl b{display:flex;align-items:center;gap:0;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ttl small{font-size:11.5px;color:var(--faint);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .art{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .len{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right}
.row .acts{display:flex;gap:5px}
.row .grip{color:var(--faint2);cursor:grab}.row.dragging{opacity:.4}.row.over{box-shadow:inset 0 2px 0 var(--gold)}
.hd{font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line);cursor:default}.hd:hover{background:transparent}
.empty{color:var(--faint);text-align:center;padding:24px 10px;font-size:13px}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.kv{display:grid;grid-template-columns:62px 1fr;gap:5px 10px;font-size:12.5px}.kv .k{color:var(--muted)}.kv .v{color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd{position:relative;min-width:0}
.dd-btn{width:100%;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink);cursor:pointer;text-align:left;font-size:13px}
.dd-btn:hover{border-color:#3a4756;background:var(--panel)}.dd-btn.open{border-color:var(--goldline)}
.dd-btn .lb{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-btn .chev{width:13px;height:13px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}.dd-btn.open .chev{transform:rotate(180deg)}
.dd-list{position:fixed;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;max-height:300px;overflow:auto;box-shadow:0 12px 32px rgba(0,0,0,.55)}
.dd-item{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--ink2)}.dd-item:hover{background:var(--card2);color:var(--strong)}.dd-item.on{color:var(--strong)}
.dd-item .ck{width:14px;height:14px;stroke:var(--gold);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;visibility:hidden;flex-shrink:0}.dd-item.on .ck{visibility:visible}
.dd-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-sep{height:1px;background:var(--line2);margin:5px 4px}
.bar{display:grid;grid-template-columns:minmax(220px,300px) 1fr minmax(260px,340px);align-items:center;gap:16px;padding:9px 16px 10px;border-top:1px solid var(--line);background:var(--panel2)}
.tile{width:44px;height:44px;border-radius:9px;border:1px solid var(--goldline);background:linear-gradient(180deg,#1b2231,#141a22);display:flex;align-items:center;justify-content:center;color:var(--gold);flex-shrink:0}
.track{height:5px;background:#1c2430;border-radius:3px;overflow:hidden}.track>i{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width .4s linear}
.log{display:grid;grid-template-columns:48px 1fr auto;gap:8px;align-items:center;padding:7px 9px;border-radius:8px;border:1px solid var(--line2);cursor:pointer}
.log.ok{background:rgba(74,222,128,.06);border-color:rgba(74,222,128,.22)}.log.warn{background:rgba(232,138,166,.06);border-color:rgba(232,138,166,.3)}
.log .ts{font-family:var(--mono);font-size:10.5px;color:var(--muted)}.log .msg{font-size:12.5px;display:flex;flex-direction:column;gap:0;min-width:0}.log .msg small{font-size:10.5px;color:var(--muted);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log .st{font-size:10.5px;padding:2px 6px;border-radius:4px;font-weight:600;background:var(--line);color:var(--ink2)}.log.ok .st{background:var(--ok);color:#0a2a12}.log.warn .st{background:var(--pink);color:#2a0a12}
.raw{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:pre-wrap;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:8px;max-height:200px;overflow:auto;word-break:break-all}
.bulk{display:flex;align-items:center;gap:6px;padding:7px 10px;margin:0 0 8px;background:rgba(226,184,102,.08);border:1px solid var(--goldline);border-radius:9px;font-size:12.5px;color:var(--strong)}
.bulk button{background:transparent;border-color:rgba(201,208,218,.22);color:var(--ink2);font-weight:500}
.bulk button:hover{background:rgba(255,255,255,.05);border-color:rgba(226,184,102,.45);color:var(--strong)}
.bulk button.pri{background:var(--gold);color:#1a1608;border-color:transparent;font-weight:600}
.bulk button.ghost{background:transparent;border-color:rgba(201,208,218,.18);color:var(--ink2)}
.plhead{display:flex;align-items:flex-start;gap:14px;padding:14px 14px 12px;border-bottom:1px solid var(--line2)}
.plhead .tile{width:64px;height:64px;border-radius:12px}
.plhead .name{font-size:20px;font-weight:700;color:var(--strong);line-height:1.2;cursor:text}
.plhead .memo{font-size:12px;color:var(--ink2);cursor:text}.plhead .memo.empty{color:var(--faint)}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:360px;max-width:92vw}dialog::backdrop{background:rgba(0,0,0,.55)}
.menu{position:fixed;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px;z-index:40;min-width:200px;max-height:60vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.menu div{padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap}.menu div:hover{background:var(--card2)}.menu .hd{color:var(--faint);font-size:11px;cursor:default}.menu .hd:hover{background:transparent}
.frm{display:grid;grid-template-columns:150px 1fr;gap:10px 12px;align-items:center;font-size:13px}.frm label{color:var(--muted)}.frm .hint{grid-column:2;font-size:11.5px;color:var(--faint);margin-top:-6px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="ic-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol><symbol id="ic-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
<symbol id="ic-prev" viewBox="0 0 24 24"><path d="M6 5v14M19 5l-11 7 11 7z"/></symbol><symbol id="ic-next" viewBox="0 0 24 24"><path d="M18 5v14M5 5l11 7-11 7z"/></symbol>
<symbol id="ic-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></symbol><symbol id="ic-repeat" viewBox="0 0 24 24"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></symbol>
<symbol id="ic-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="ic-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></symbol>
<symbol id="ic-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol><symbol id="ic-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
<symbol id="ic-grip" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></symbol>
<symbol id="ic-note" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol><symbol id="ic-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
<symbol id="ic-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 4v4h4"/></symbol><symbol id="ic-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
<symbol id="ic-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol><symbol id="ic-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
<symbol id="ic-doc" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></symbol><symbol id="ic-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="ic-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></symbol><symbol id="ic-ck" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
</defs></svg>

<div class="top">
  <div class="brand"><small>MABINOGI MOBILE</small><b>악보함</b></div>
  <span class="grow"></span>
  <span class="status"><span class="dot" id="cliDot"></span><span id="cliText">CLI 확인 중</span></span>
  <span class="status" id="fetched">—</span>
  <button class="ghost small" id="btnReport"><svg class="i s"><use href="#ic-doc"/></svg>정규화 보고</button>
  <button class="ghost small" id="btnSettings"><svg class="i s"><use href="#ic-gear"/></svg>설정</button>
  <button class="pri" id="btnSync"><svg class="i s"><use href="#ic-refresh"/></svg>갱신</button>
</div>

<div class="grid">
  <div class="card"><div class="chd">보관함<span class="grow"></span><button class="small ghost" id="btnNewFolder"><svg class="i s"><use href="#ic-folder"/></svg>폴더</button><button class="small pri" id="btnNewList"><svg class="i s"><use href="#ic-plus"/></svg>목록</button></div><div class="cbd tree" id="tree"></div></div>

  <div class="card">
    <div id="midHead"></div>
    <div class="cbd" id="mid"></div>
  </div>

  <div style="display:flex;flex-direction:column;gap:12px;min-height:0">
    <div class="card" id="selCard"><div class="chd">선택한 악보<span class="grow"></span><span class="m" id="selMeta"></span></div><div class="cbd" id="selBody"><div class="empty">목록에서 곡을 누르세요</div></div></div>
    <div class="card" id="queueCard" hidden><div class="chd">다음 재생<span class="m" id="queueMeta"></span><span class="grow"></span><button class="small ghost" id="btnClearQueue">비우기</button></div><div class="cbd" id="queueBody"></div></div>
    <div class="card" style="flex:1"><div class="chd">CLI 응답<span class="m" id="logMeta"></span><span class="grow"></span><button class="small ghost" id="btnRaw">원문</button></div><div class="cbd" id="logBody"><div class="empty">아직 없음</div></div></div>
  </div>
</div>

<div class="bar">
  <div style="display:flex;align-items:center;gap:10px;min-width:0"><div class="tile"><svg class="i l"><use href="#ic-note"/></svg></div>
    <div style="display:flex;flex-direction:column;gap:1px;min-width:0"><span style="display:flex;align-items:center;min-width:0"><b id="nowTitle" style="color:var(--strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">—</b><span class="badge play" id="nowBadge" hidden>재생 중</span></span><span id="nowSub" style="font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">대기</span></div></div>
  <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
    <div style="display:flex;align-items:center;justify-content:center;gap:8px">
      <button class="tb" id="btnShuffle" title="셔플"><svg class="i"><use href="#ic-shuffle"/></svg></button>
      <button class="tb" id="btnPrev" title="이전 곡"><svg class="i"><use href="#ic-prev"/></svg></button>
      <button class="tb big" id="btnMain" title="정지/재생"><svg class="i l" id="mainIcon"><use href="#ic-play"/></svg></button>
      <button class="tb" id="btnNext" title="다음 곡"><svg class="i"><use href="#ic-next"/></svg></button>
      <button class="tb" id="btnRepeat" title="반복: 끔"><svg class="i"><use href="#ic-repeat"/></svg><span id="rep1" style="position:absolute;font-size:8px;font-weight:700;margin-left:22px;margin-top:-14px" hidden>1</span></button>
    </div>
    <div style="display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px"><span class="num" id="tEl" style="font-size:11px;color:var(--muted);text-align:right">0:00</span><div class="track"><i id="prog" style="width:0%"></i></div><span class="num" id="tTot" style="font-size:11px;color:var(--muted)">0:00</span></div>
  </div>
  <div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0"><span style="font-size:12px;color:var(--muted)">악기</span><div class="dd" id="instDd" style="flex:1;max-width:230px"></div><button class="ghost small" id="btnQueue"><svg class="i s"><use href="#ic-list"/></svg>다음 <span class="num" id="queueN" style="color:var(--gold)">0</span></button></div>
</div>

<dialog id="dlg"><form method="dialog" style="display:flex;flex-direction:column;gap:10px"><div id="dlgTitle" style="font-weight:600">이름</div><input id="dlgInput" style="width:100%"><div style="display:flex;justify-content:flex-end;gap:6px"><button value="cancel">취소</button><button class="pri" value="ok">확인</button></div></form></dialog>
<dialog id="rep" style="min-width:760px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><b>정규화 보고</b><span class="note" id="repMeta"></span><span class="grow"></span><form method="dialog"><button value="ok">닫기</button></form></div><div class="raw" id="repBody" style="max-height:70vh"></div></dialog>
<dialog id="set" style="min-width:560px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:14px"><b>설정</b><span class="grow"></span><form method="dialog"><button value="cancel">닫기</button></form></div>
  <div class="frm">
    <label>CLI 실행파일 경로</label><input id="sCli" placeholder="비우면 자동 탐색 (C:\Nexon\MabinogiMobile\MabinogiMobile_CLI.exe → PATH)">
    <span class="hint" id="sCliHint">—</span>
    <label>기본 악기</label><div class="dd" id="sInstDd"></div>
    <label>곡 사이 대기(초)</label><input id="sGap" type="number" min="0" max="60" step="1" style="width:120px">
    <label>다음 곡 전환 여유(초)</label><input id="sMargin" type="number" min="0" max="15" step="0.5" style="width:120px">
    <span class="hint">게임 연주가 반복 설정이면 곡이 스스로 안 끝나서, 끝나기 이만큼 전에 정지하고 다음 곡을 보냅니다.</span>
    <label>재생 전 현재 연주 정지</label><label style="color:var(--ink2);display:flex;gap:8px;align-items:center"><input type="checkbox" id="sStop"> 켜기</label>
    <label>시작 시 자동 갱신</label><label style="color:var(--ink2);display:flex;gap:8px;align-items:center"><input type="checkbox" id="sAuto"> CLI 연결돼 있으면 악기·악보를 다시 받음</label>
  </div>
  <div style="display:flex;justify-content:flex-end;gap:6px;margin-top:14px"><button id="sTest" class="ghost">연결 확인</button><button id="sSave" class="pri">저장</button></div>
</dialog>

<script>
const $=(id)=>document.getElementById(id);
const api=async(path,body)=>{const r=await fetch(path,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:undefined);return r.json();};
const esc=(s)=>String(s??"").replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const INDEX="ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎABCDEFGHIJKLMNOPQRSTUVWXYZ#";
const fmtSec=(s)=>{s=Math.max(0,Math.floor(s||0));return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;};
const fmtTs=(t)=>t?new Date(t*1000).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
const fmtClock=(t)=>{const d=new Date(t*1000);return [d.getHours(),d.getMinutes(),d.getSeconds()].map((n)=>String(n).padStart(2,"0")).join(":");};
const ICON=(n,c="")=>`<svg class="i ${c}"><use href="#ic-${n}"/></svg>`;
let S={all:[],byTitle:new Map(),summary:{artists:[],other:0,count:0,byInitial:{}},lists:{folders:[],playlists:[]},instruments:[],settings:{},
  view:{kind:"lib"},q:"",initial:"",filter:"",sort:"rel",artSort:"count",artQ:"",selected:new Set(),sel:null,
  queue:[],order:[],qi:-1,src:"",shuffle:false,repeat:"off",now:null,playing:false,pollT:null,startedAt:0,advancing:false,manualStop:false,gapT:null,
  instrument:"",rawOpen:false,logs:[]};

function ask(title,def=""){return new Promise((res)=>{$("dlgTitle").textContent=title;$("dlgInput").value=def;$("dlg").onclose=()=>res($("dlg").returnValue==="ok"?$("dlgInput").value.trim():null);$("dlg").showModal();$("dlgInput").select();});}
function menu(e,items){document.querySelectorAll(".menu").forEach((m)=>m.remove());const m=document.createElement("div");m.className="menu";const x=Math.min(e.clientX??e.pageX,window.innerWidth-230),y=Math.min(e.clientY??e.pageY,window.innerHeight-260);m.style.left=x+"px";m.style.top=y+"px";
  m.innerHTML=items.map(([t,fn])=>`<div class="${fn?"":"hd"}">${esc(t)}</div>`).join("");[...m.children].forEach((c,i)=>{if(items[i][1])c.onclick=()=>{m.remove();items[i][1]();};});document.body.appendChild(m);setTimeout(()=>document.addEventListener("click",()=>m.remove(),{once:true}),0);}

/* ── 드롭다운 (범용) ── */
function ddMake(el,getItems,getVal,setVal){
  el.innerHTML=`<button type="button" class="dd-btn"><span class="lb"></span><svg class="chev"><use href="#ic-chev"/></svg></button><div class="dd-list" hidden></div>`;
  const btn=el.querySelector(".dd-btn"),list=el.querySelector(".dd-list"),lb=el.querySelector(".lb");
  const label=()=>{const it=getItems().find((x)=>x.v===getVal());lb.innerHTML=it?esc(it.label)+(it.eq?' <span class="badge eq">장착</span>':""):esc(getItems()[0]?.label||"");};
  const close=()=>{list.hidden=true;btn.classList.remove("open");};
  const open=()=>{const items=getItems();list.innerHTML=items.map((it,k)=>`${it.sep?'<div class="dd-sep"></div>':""}<div class="dd-item ${getVal()===it.v?"on":""}" data-v="${esc(it.v)}"><svg class="ck"><use href="#ic-ck"/></svg><span class="nm">${esc(it.label)}</span>${it.eq?'<span class="badge eq">장착 중</span>':""}</div>`).join("");
    list.querySelectorAll(".dd-item").forEach((n)=>n.onclick=(ev)=>{ev.stopPropagation();setVal(n.dataset.v);label();close();});
    const r=btn.getBoundingClientRect();list.style.left=r.left+"px";list.style.top=(r.bottom+6)+"px";list.style.width=Math.max(r.width,200)+"px";list.hidden=false;btn.classList.add("open");
    setTimeout(()=>document.addEventListener("click",function h(ev){if(!el.contains(ev.target)){close();}else if(!list.hidden)document.addEventListener("click",h,{once:true});},{once:true}),0);};
  btn.onclick=(ev)=>{ev.stopPropagation();list.hidden?open():close();};
  window.addEventListener("resize",close);document.addEventListener("keydown",(ev)=>{if(ev.key==="Escape")close();});
  el._refresh=label;label();return {refresh:label};
}
const instItems=()=>[{v:"",label:"악기 그대로"}].concat(S.instruments.map((i,k)=>({v:i.name,label:i.name,eq:i.equipped,sep:k===0})));

/* ── 데이터 로드 ── */
async function refreshState(){const s=await api("/api/state");const c=s.cli||{};$("cliDot").className="dot "+(c.found?(c.pipe==="connected"?"on":"off"):"");S.cliOk=c.found&&c.pipe==="connected";
  $("cliText").textContent=!c.found?"CLI 없음 — 설정에서 경로 지정 또는 인게임 토글":(c.pipe==="connected"?"CLI 연결됨":`CLI 끊김 ${c.reason||c.status_error||""}`);
  $("fetched").textContent=`악보 ${s.scores.count} · 악기 ${s.instruments.count} · 수신 ${fmtTs(s.scores.fetched_at)}`;return s;}
async function loadAll(){const [sc,ls,ar,ins,st]=await Promise.all([api("/api/scores"),api("/api/playlists"),api("/api/artists"),api("/api/instruments"),api("/api/settings")]);
  S.all=sc.items;S.byTitle=new Map(sc.items.map((i)=>[i.title,i]));S.summary={...sc.summary,artists:ar.artists,other:ar.other};S.lists=ls;S.instruments=ins.items;S.settings=st.settings;
  if(S.instrument&&!S.instruments.some((i)=>i.name===S.instrument))S.instrument="";$("instDd")._refresh&&$("instDd")._refresh();render();}
async function loadLog(){const d=await api("/api/log");S.logs=d.items;renderLog();}

/* ── 렌더: 레일 ── */
function render(){renderTree();renderMid();renderSel();renderQueue();}
function renderTree(){
  const {folders,playlists}=S.lists,v=S.view,el=$("tree");
  const byParent=(pid)=>folders.filter((f)=>(f.parent||null)===pid),plsIn=(fid)=>playlists.filter((p)=>(p.folder||null)===fid);
  const plRow=(p)=>`<div class="it ${v.kind==="pl"&&v.id===p.id?"on":""}" data-pl="${p.id}">${ICON(S.src==="pl:"+p.id&&S.playing?"play":"list","s")}<span class="nm">${esc(p.name)}</span><span class="cnt">${p.items.length}</span></div>`;
  const fold=(fid)=>byParent(fid).map((f)=>`<div class="it" data-f="${f.id}">${ICON("folder","s")}<span class="nm">${esc(f.name)}</span><span class="cnt">${plsIn(f.id).length}</span></div><div class="sub">${plsIn(f.id).map(plRow).join("")}${fold(f.id)}</div>`).join("");
  let arts=S.summary.artists||[];if(S.artQ){const q=S.artQ.toLowerCase();arts=arts.filter((a)=>a.name.toLowerCase().includes(q));}
  arts=S.artSort==="name"?[...arts].sort((a,b)=>a.name.localeCompare(b.name,"ko")):arts;
  const recentN=S.all.filter((i)=>i.lastPlayed).length;
  el.innerHTML=`<div class="sec">라이브러리</div>
    <div class="it ${v.kind==="lib"?"on":""}" data-view="lib">${ICON("note","s")}<span class="nm">전체 악보</span><span class="cnt">${S.summary.count||0}</span></div>
    <div class="it ${v.kind==="recent"?"on":""}" data-view="recent">${ICON("clock","s")}<span class="nm">최근 재생</span><span class="cnt">${recentN}</span></div>
    <div class="it ${v.kind==="other"?"on":""}" data-view="other">${ICON("user","s")}<span class="nm">기타 · 미분류</span><span class="cnt" style="color:var(--pink)">${S.summary.other||0}</span></div>
    <div class="sec">재생목록<span class="cnt">${playlists.length}</span></div>${plsIn(null).map(plRow).join("")}${fold(null)}${playlists.length||folders.length?"":`<div class="note" style="padding:6px 8px;border:1px dashed var(--line);border-radius:8px;margin:2px 4px;text-align:center">「+ 목록」이나 곡의 + 로 만드세요</div>`}
    <div class="sec">아티스트<span class="cnt">${(S.summary.artists||[]).length}</span><span class="seg" style="font-size:10.5px;margin-left:6px"><span class="${S.artSort==="count"?"on":""}" data-as="count">곡수</span><span class="${S.artSort==="name"?"on":""}" data-as="name">이름</span></span></div>
    <div style="display:flex;align-items:center;gap:6px;padding:5px 8px;margin:2px 2px 4px;border:1px solid var(--line);border-radius:7px;background:var(--panel)">${ICON("search","s")}<input id="artQ" placeholder="아티스트 검색" value="${esc(S.artQ)}" style="border:none;background:transparent;padding:0;flex:1;font-size:12px;min-width:0"></div>
    ${arts.map((a)=>`<div class="it ${a.manual?"":"auto"} ${v.kind==="artist"&&v.key===a.key?"on":""}" data-ar="${esc(a.key)}" title="${a.manual?"등록된 아티스트":"제목에서 자동 추출 — 우클릭으로 등록·별칭·합치기"}"><span style="color:var(--gold);font-size:10px;width:10px;text-align:center">${a.manual?"★":"·"}</span><span class="nm">${esc(a.name)}</span><span class="cnt">${a.count}</span></div>`).join("")}`;
  el.querySelectorAll("[data-view]").forEach((n)=>n.onclick=()=>setView({kind:n.dataset.view}));
  el.querySelectorAll("[data-pl]").forEach((n)=>{n.onclick=()=>setView({kind:"pl",id:n.dataset.pl});n.oncontextmenu=(e)=>{e.preventDefault();plMenu(e,n.dataset.pl);};});
  el.querySelectorAll("[data-f]").forEach((n)=>{n.oncontextmenu=(e)=>{e.preventDefault();menu(e,[["이름 변경",()=>renameFolder(n.dataset.f)],["하위 폴더",()=>newFolder(n.dataset.f)],["여기에 목록",()=>newList(n.dataset.f)],["폴더 삭제",()=>delFolder(n.dataset.f)]]);};});
  el.querySelectorAll("[data-ar]").forEach((n)=>{n.onclick=()=>setView({kind:"artist",key:n.dataset.ar});n.oncontextmenu=(e)=>{e.preventDefault();artistMenu(e,n.dataset.ar);};});
  el.querySelectorAll("[data-as]").forEach((n)=>n.onclick=(e)=>{e.stopPropagation();S.artSort=n.dataset.as;renderTree();});
  const aq=$("artQ");aq.oninput=()=>{S.artQ=aq.value;const pos=aq.selectionStart;renderTree();const n=$("artQ");n.focus();n.setSelectionRange(pos,pos);};
}
function setView(v){S.view=v;S.selected.clear();S.initial="";S.filter="";renderTree();renderMid();}

/* ── 렌더: 가운데 ── */
function currentItems(){
  const v=S.view;let items=S.all;
  if(v.kind==="pl"){const pl=S.lists.playlists.find((p)=>p.id===v.id);return pl?pl.items.map((it,k)=>({...(S.byTitle.get(it.title)||{title:it.title,song:it.title,cleaned:it.title,artist:"",tags:[],missing:true}),plInst:it.inst,plIndex:k})):[];}
  if(v.kind==="recent")items=items.filter((i)=>i.lastPlayed);
  if(v.kind==="other")items=items.filter((i)=>i.bucket==="other");
  if(v.kind==="artist")items=items.filter((i)=>i.artistKey===v.key);
  if(S.q){const qt=S.q.toLowerCase().split(/\s+/).filter(Boolean);items=items.filter((i)=>qt.every((t)=>(i.norm||"").includes(t.replace(/[\s\-_.]/g,""))||(i.artist||"").toLowerCase().includes(t)||(i.title||"").toLowerCase().includes(t)));}
  if(S.initial)items=items.filter((i)=>i.initial===S.initial);
  if(S.filter==="artist")items=items.filter((i)=>i.bucket==="artist");if(S.filter==="other")items=items.filter((i)=>i.bucket==="other");if(S.filter==="dup")items=items.filter((i)=>i.dupExact>1);if(S.filter==="manual")items=items.filter((i)=>i.manual);
  if(v.kind==="recent")items=[...items].sort((a,b)=>b.lastPlayed-a.lastPlayed);
  else if(S.sort==="title")items=[...items].sort((a,b)=>(a.song||a.title).localeCompare(b.song||b.title,"ko"));
  else if(S.sort==="artist")items=[...items].sort((a,b)=>(a.artist||"힣").localeCompare(b.artist||"힣","ko")||(a.song||"").localeCompare(b.song||"","ko"));
  else if(S.sort==="recent")items=[...items].sort((a,b)=>(b.lastPlayed||0)-(a.lastPlayed||0));
  return items;
}
function renderMid(){
  const v=S.view,items=currentItems();S._items=items;
  const pl=v.kind==="pl"?S.lists.playlists.find((p)=>p.id===v.id):null;
  if(pl){renderPlHead(pl,items);renderPlRows(pl,items);return;}
  const art=v.kind==="artist"?(S.summary.artists||[]).find((a)=>a.key===v.key):null;
  const title=v.kind==="lib"?"전체 악보":v.kind==="recent"?"최근 재생":v.kind==="other"?"기타 · 미분류":(art?art.name:"아티스트");
  const s=S.summary,dupN=(s.duplicateTitles||[]).length;
  $("midHead").innerHTML=`<div class="chd"><span>${esc(title)}</span><span class="m">${items.length}곡${v.kind==="lib"?` · 인식 ${s.count-s.other} / 기타 ${s.other}${dupN?` · 동명 ${dupN}건`:""}`:""}</span><span class="grow"></span>
      ${art?`<button class="small ghost" id="btnArtMenu">${ICON("more","s")}</button>`:""}${v.kind!=="lib"?`<button class="small ghost" id="btnBack">← 전체</button>`:""}
      <span class="m">정렬</span><span class="seg" id="sortSeg"><span data-s="rel" class="${S.sort==="rel"?"on":""}">기본</span><span data-s="title" class="${S.sort==="title"?"on":""}">제목</span><span data-s="artist" class="${S.sort==="artist"?"on":""}">아티스트</span><span data-s="recent" class="${S.sort==="recent"?"on":""}">최근</span></span></div>
    <div style="padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line2)">
      <div style="display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--panel);border:1px solid var(--line);border-radius:9px">${ICON("search")}<input id="q" value="${esc(S.q)}" placeholder="제목·아티스트·파일명 검색" style="flex:1;border:none;background:transparent;padding:0;font-size:14px;min-width:0"><span class="num" style="font-size:11px;color:var(--faint)">${items.length} / ${S.summary.count||0}</span>${S.q?`<button class="ghost small" id="qClear">${ICON("x","s")}</button>`:""}</div>
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <span class="chip ${S.filter==="artist"?"on":""}" data-fl="artist">인식됨 <span class="num">${s.count-s.other}</span></span><span class="chip ${S.filter==="other"?"on":""}" data-fl="other">기타 <span class="num">${s.other}</span></span><span class="chip ${S.filter==="dup"?"on":""}" data-fl="dup">동명만</span><span class="chip ${S.filter==="manual"?"on":""}" data-fl="manual">수동 지정</span>
        <span style="width:1px;height:14px;background:var(--line);margin:0 2px"></span>
        <span class="idx">${[...INDEX].map((c)=>`<span class="${S.initial===c?"on":""} ${s.byInitial&&s.byInitial[c]?"":"zero"}" data-i="${c}">${c}</span>`).join("")}</span></div></div>`+bulkHtml(items);
  $("midHead").querySelectorAll("[data-s]").forEach((n)=>n.onclick=()=>{S.sort=n.dataset.s;renderMid();});
  $("midHead").querySelectorAll("[data-fl]").forEach((n)=>n.onclick=()=>{S.filter=S.filter===n.dataset.fl?"":n.dataset.fl;renderMid();});
  $("midHead").querySelectorAll("[data-i]").forEach((n)=>n.onclick=()=>{if(n.classList.contains("zero")&&S.initial!==n.dataset.i)return;S.initial=S.initial===n.dataset.i?"":n.dataset.i;renderMid();});
  const q=$("q");q.oninput=()=>{S.q=q.value;clearTimeout(S._qt);S._qt=setTimeout(()=>{const pos=q.selectionStart;renderMid();const n=$("q");n.focus();n.setSelectionRange(pos,pos);},120);};
  if($("qClear"))$("qClear").onclick=()=>{S.q="";renderMid();};if($("btnBack"))$("btnBack").onclick=()=>setView({kind:"lib"});if($("btnArtMenu"))$("btnArtMenu").onclick=(e)=>artistMenu(e,v.key);
  const st=$("mid").scrollTop;
  $("mid").innerHTML=`<div class="row hd"><input type="checkbox" id="ckAll" ${S.selected.size&&S.selected.size===items.length?"checked":""}><span>#</span><span>제목 · 파일명</span><span>아티스트</span><span style="text-align:right">길이</span><span></span></div>`+
    (items.length?items.map((it,i)=>rowHtml(it,i)).join(""):`<div class="empty">${S.summary.count?"조건에 맞는 곡이 없습니다":"아직 수신한 악보가 없습니다 — 「갱신」을 누르세요"}</div>`);
  $("mid").scrollTop=st;
  bindRows(items);bindBulk(items);
  $("ckAll").onchange=()=>{S.selected=new Set($("ckAll").checked?items.map((i)=>i.title):[]);renderMid();};
}
// 체크한 곡에 대한 일괄 작업 — 스크롤되지 않는 상단(midHead)에 고정
function bulkHtml(items){const n=S.selected.size;if(!n)return "";const inPl=S.view.kind==="pl";
  return `<div class="bulk" style="margin:8px 12px 0"><input type="checkbox" id="selAll" checked><span>선택 <b>${n}</b>곡</span><span class="grow"></span>
    <button class="small pri" id="bPlay">${ICON("play","s")}선택 재생</button><button class="small" id="bAdd">${ICON("plus","s")}재생목록에 담기</button><button class="small ghost" id="bNew">새 목록으로</button>
    ${inPl?`<button class="small ghost" id="bRemove">이 목록에서 제거</button>`:`<button class="small ghost" id="bAssign">${ICON("user","s")}아티스트 지정</button><button class="small ghost" id="bUnassign">지정 해제</button>`}
    <button class="small ghost" id="bClear" title="선택 해제">${ICON("x","s")}</button></div>`;}
function bindBulk(items){const sel=()=>items.filter((i)=>S.selected.has(i.title));
  if($("selAll"))$("selAll").onchange=()=>{S.selected.clear();renderMid();};if($("bClear"))$("bClear").onclick=()=>{S.selected.clear();renderMid();};
  if($("bPlay"))$("bPlay").onclick=()=>{const list=sel().map((it)=>({title:it.title,inst:it.plInst||""}));if(list.length)playFrom(list,0,"view");};
  if($("bAdd"))$("bAdd").onclick=(e)=>addMenu(e,[...S.selected]);if($("bNew"))$("bNew").onclick=()=>newList(null,[...S.selected]);
  if($("bAssign"))$("bAssign").onclick=(e)=>assignMenu(e,[...S.selected]);if($("bUnassign"))$("bUnassign").onclick=async()=>{await api("/api/artists",{op:"unassign",titles:[...S.selected]});S.selected.clear();await loadAll();};
  if($("bRemove"))$("bRemove").onclick=async()=>{S.lists=await api("/api/playlists",{op:"remove",id:S.view.id,titles:[...S.selected]});S.selected.clear();render();};
}
function rowHtml(it,i){const playing=S.now&&S.now.title===it.title&&S.playing;const inPl=S.view.kind==="artist";
  return `<div class="row ${S.sel===it.title?"sel":""}" data-t="${esc(it.title)}"><input type="checkbox" data-ck="${esc(it.title)}" ${S.selected.has(it.title)?"checked":""}><span class="no">${i+1}</span>
    <div class="ttl"><b>${esc(it.song||it.cleaned)}${playing?'<span class="badge play">재생 중</span>':""}${it.variant?`<span class="badge var">${esc(it.variant)}</span>`:""}${(it.tags||[]).map((t)=>`<span class="badge tag">${esc(t)}</span>`).join("")}${it.dupExact>1?`<span class="badge dup">동명 ${it.dupExact}</span>`:""}</b><small>${esc(it.title)}</small></div>
    <span class="art">${esc(it.artist||"")}${it.manual?'<span class="badge man">수동</span>':""}</span><span class="len">${it.duration?fmtSec(it.duration):""}</span>
    <span class="acts"><button class="ic pri" data-play="${esc(it.title)}" title="재생">${ICON("play","s")}</button><button class="ic" data-add="${esc(it.title)}" title="재생목록에 담기">${ICON("plus","s")}</button><button class="ic dim" data-more="${esc(it.title)}">${ICON("more","s")}</button></span></div>`;}
function bindRows(items){const M=$("mid");

/* ── 큐·재생 ── */
function qOrder(){return S.order.length?S.order:S.queue.map((_,i)=>i);}
function qPos(){return qOrder().indexOf(S.qi);}
function makeOrder(){const idx=S.queue.map((_,i)=>i);if(!S.shuffle){S.order=idx;return;}const cur=S.qi;const rest=idx.filter((i)=>i!==cur);for(let i=rest.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]];}S.order=cur>=0?[cur,...rest]:rest;}

async function playIndex(i){clearTimeout(S.gapT);const it=S.queue[i];if(!it)return;S.qi=i;S.manualStop=false;S.advancing=false;
  const lib=S.byTitle.get(it.title);S.now={title:it.title,inst:it.inst||S.instrument||"",song:lib?(lib.song||lib.cleaned):it.title,artist:lib?lib.artist:""};
  $("nowTitle").textContent=S.now.song;$("nowSub").textContent="전송 중…";$("prog").style.width="0%";$("tEl").textContent="0:00";$("tTot").textContent=(lib&&lib.duration)?fmtSec(lib.duration):"0:00";
  const r=await api("/api/play",{title:it.title,instrument:it.inst||S.instrument||null});
  S.playing=r.ok;S.startedAt=Date.now();
  if(!r.ok){$("nowSub").textContent="실패: "+(r.error||r.steps?.at(-1)?.error||"")+" "+(r.message||r.steps?.at(-1)?.message||"");loadLog();if(S.queue.length>1){S.gapT=setTimeout(()=>advance(1),1500);}return;}
  setMain(true);startPoll();loadLog();renderMid();renderQueue();renderTree();}
function setMain(playing){$("mainIcon").innerHTML=`<use href="#ic-${playing?"stop":"play"}"/>`;$("nowBadge").hidden=!playing;}

async function advance(dir){ // dir=+1 다음, -1 이전
  if(S.advancing)return;S.advancing=true;const ord=qOrder();let pos=ord.indexOf(S.qi);
  if(S.repeat==="one"&&dir===0){await playIndex(S.qi);S.advancing=false;return;}
  pos+=dir===0?1:dir;
  if(pos>=ord.length){if(S.repeat==="all"){pos=0;}else{await stopAll("재생목록 끝");S.advancing=false;return;}}
  if(pos<0)pos=S.repeat==="all"?ord.length-1:0;
  await playIndex(ord[pos]);S.advancing=false;}
async function stopAll(msg){clearInterval(S.pollT);clearTimeout(S.gapT);S.playing=false;setMain(false);$("nowSub").textContent=msg||"대기";$("prog").style.width="0%";renderMid();renderQueue();renderTree();}

    $("nowSub").textContent=`${p.MusicTitle||S.now?.song||""} · ${p.InstrumentName||""}${p.IsLoop?" · 반복 설정":""}${S.src.startsWith("pl:")?` · ${qPos()+1}/${S.queue.length}`:""}`;
    $("tEl").textContent=fmtSec(el);$("tTot").textContent=fmtSec(tot);$("prog").style.width=(tot?Math.min(100,el/tot*100):0)+"%";
    if(S.playing&&tot&&!S.advancing&&((tot-el)<=(s.advance_margin??2)||localEl>=tot-1)){
      await api("/api/stop",{});S.playing=false;const gap=(s.gap_sec??2)*1000;$("nowSub").textContent=`다음 곡까지 ${s.gap_sec??2}초…`;clearTimeout(S.gapT);S.gapT=setTimeout(()=>advance(0),gap);}
  }else if(S.playing){S.playing=false;if(S.manualStop){stopAll("정지됨");return;}
    const gap=(s.gap_sec??2)*1000;$("nowSub").textContent=S.queue.length>1||S.repeat!=="off"?`연주 종료 · ${s.gap_sec??2}초 후 다음`:"연주 종료";clearTimeout(S.gapT);S.gapT=setTimeout(()=>advance(0),gap);}
}

  $("queueBody").innerHTML=(now?`<div style="padding:9px 11px;border-radius:9px;border:1px solid var(--goldline);background:rgba(226,184,102,.08);margin-bottom:6px"><div style="font-size:11px;color:var(--gold);letter-spacing:.08em">${S.playing?"재생 중":"현재"}</div><div style="font-weight:700;color:var(--strong)">${esc(lib(now.title).song||now.title)}</div><div style="font-size:11.5px;color:var(--ink2)">${esc(lib(now.title).artist||"")}${now.inst?" · "+esc(now.inst):" · 악기 그대로"}</div></div>`:"")+
    (up.length?up.slice(0,30).map((it,k)=>`<div style="display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 9px;border-radius:8px;border:1px solid var(--line2);margin-bottom:4px;cursor:pointer" data-qj="${ord[pos+1+k]}"><span class="num" style="font-size:11px;color:var(--faint);width:16px">${k+1}</span><div style="min-width:0"><div style="font-size:12.5px;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(lib(it.title).song||it.title)}</div><div style="font-size:11px;color:var(--muted)">${esc(lib(it.title).artist||"")}${it.inst?" · "+esc(it.inst):""}</div></div><span class="num" style="font-size:11px;color:var(--muted)">${lib(it.title).duration?fmtSec(lib(it.title).duration):""}</span></div>`).join("")+(up.length>30?`<div class="note" style="text-align:center">+ ${up.length-30}곡</div>`:""):`<div class="note" style="padding:4px 2px">다음 곡 없음</div>`);
  $("queueBody").querySelectorAll("[data-qj]").forEach((n)=>n.onclick=()=>{clearTimeout(S.gapT);playIndex(Number(n.dataset.qj));});}

/* ── CLI 로그 ── */
function renderLog(){const L=S.logs||[];$("logMeta").textContent=L.length?`최근 ${Math.min(L.length,40)}건`:"";
  $("logBody").innerHTML=L.length?L.slice(0,40).map((l,i)=>`<div class="log ${l.ok?(i===0?"ok":""):"warn"}" data-li="${i}"><span class="ts">${fmtClock(l.ts)}</span><span class="msg"><span>${esc(l.summary||l.command)}</span><small>${esc(l.command)}${l.error?" · "+esc(l.error):""} · ${l.elapsed}s${l.message?" · "+esc(l.message):""}</small></span><span class="st">${l.ok?"OK":"주의"}</span></div>${S.rawOpen===i?`<div class="raw" style="margin:-2px 0 6px">${esc(l.raw)}</div>`:""}`).join(""):`<div class="empty">아직 없음</div>`;
  $("logBody").querySelectorAll("[data-li]").forEach((n)=>n.onclick=()=>{S.rawOpen=S.rawOpen===Number(n.dataset.li)?-1:Number(n.dataset.li);renderLog();});}
$("btnRaw").onclick=()=>{S.rawOpen=S.rawOpen===0?-1:0;renderLog();};

/* ── 아티스트·재생목록 조작 ── */
function assignMenu(e,titles){const arts=S.summary.artists||[],manual=arts.filter((a)=>a.manual),auto=arts.filter((a)=>!a.manual);const it=titles.length===1?S.byTitle.get(titles[0]):null;
  const items=[[`${titles.length}곡 → 아티스트 지정`,null]];
  if(it&&it.artist&&it.song)items.push([`뒤집기: 「${it.song}」을 아티스트로`,async()=>{await api("/api/artists",{op:"assign",titles,name:it.song});S.selected.clear();await loadAll();}]);
  if(it&&!it.artist){const first=(it.song||it.cleaned).split(/\s+/)[0];if(first&&first.length>=2&&first!==it.song)items.push([`첫 단어 「${first}」을 아티스트로`,async()=>{await api("/api/artists",{op:"assign",titles,name:first});S.selected.clear();await loadAll();}]);}
  items.push(["+ 새 아티스트…",async()=>{const name=await ask("아티스트 이름",it&&it.artist?it.artist:"");if(!name)return;await api("/api/artists",{op:"assign",titles,name});S.selected.clear();await loadAll();}]);
  if(manual.length)items.push(["— 등록된 아티스트 —",null]);manual.forEach((a)=>items.push([`★ ${a.name} (${a.count})`,async()=>{await api("/api/artists",{op:"assign",titles,id:a.key});S.selected.clear();await loadAll();}]));
  if(auto.length)items.push(["— 자동 추출 (지정하면 등록) —",null]);auto.slice(0,40).forEach((a)=>items.push([`· ${a.name} (${a.count})`,async()=>{await api("/api/artists",{op:"assign",titles,name:a.name});S.selected.clear();await loadAll();}]));
  items.push(["지정 해제",async()=>{await api("/api/artists",{op:"unassign",titles});S.selected.clear();await loadAll();}]);menu(e,items);}
function artistMenu(e,key){const a=(S.summary.artists||[]).find((x)=>x.key===key);if(!a)return;const titlesOf=async()=>S.all.filter((i)=>i.artistKey===key).map((i)=>i.title);
  menu(e,[[a.name,null],[a.manual?"이름 변경":"정식 아티스트로 등록",async()=>{const name=await ask(a.manual?"이름 변경":"정식 등록",a.name);if(!name)return;if(a.manual)await api("/api/artists",{op:"rename",id:key,name});else await api("/api/artists",{op:"assign",titles:await titlesOf(),name});await loadAll();}],
    ["별칭 추가",async()=>{if(!a.manual){alert("먼저 정식 아티스트로 등록하세요");return;}const al=await ask(`「${a.name}」의 별칭 (예: IU, 방탄소년단)`);if(!al)return;await api("/api/artists",{op:"alias",id:key,alias:al});await loadAll();}],
    ["다른 아티스트에 합치기",()=>{const targets=(S.summary.artists||[]).filter((x)=>x.manual&&x.key!==key);if(!targets.length){alert("합칠 정식 아티스트가 없습니다 (먼저 하나를 등록하세요)");return;}menu(e,[[`「${a.name}」을 다음으로`,null]].concat(targets.map((t)=>[`★ ${t.name}`,async()=>{if(a.manual)await api("/api/artists",{op:"merge",from:key,into:t.key});else{await api("/api/artists",{op:"assign",titles:await titlesOf(),id:t.key});await api("/api/artists",{op:"alias",id:t.key,alias:a.name});}if(S.view.kind==="artist")S.view={kind:"artist",key:t.key};await loadAll();}])));}],
    ...(a.manual?[["삭제(지정 해제)",async()=>{if(!confirm(`「${a.name}」 등록을 지우고 지정을 해제할까요?`))return;await api("/api/artists",{op:"delete",id:key});if(S.view.kind==="artist")S.view={kind:"lib"};await loadAll();}]]:[])]);}
function addMenu(e,titles){const pls=S.lists.playlists;menu(e,[[`${titles.length}곡 담기`,null]].concat(pls.map((p)=>[`♪ ${p.name} (${p.items.length})`,async()=>{S.lists=await api("/api/playlists",{op:"add",id:p.id,titles});S.selected.clear();render();}])).concat([["+ 새 재생목록에",()=>newList(null,titles)]]));}
async function newList(folder=null,titles=[]){const name=await ask("재생목록 이름","새 재생목록");if(name===null)return;S.lists=await api("/api/playlists",{op:"create",name,folder});const pl=S.lists.playlists.at(-1);if(titles.length)S.lists=await api("/api/playlists",{op:"add",id:pl.id,titles});S.selected.clear();setView({kind:"pl",id:pl.id});}
async function newFolder(parent=null){const name=await ask("폴더 이름","새 폴더");if(name===null)return;S.lists=await api("/api/playlists",{op:"folder_create",name,parent});renderTree();}
async function renamePl(id){const pl=S.lists.playlists.find((p)=>p.id===id);const name=await ask("이름 변경",pl.name);if(name===null)return;S.lists=await api("/api/playlists",{op:"rename",id,name});render();}
async function renameFolder(id){const f=S.lists.folders.find((x)=>x.id===id);const name=await ask("폴더 이름",f.name);if(name===null)return;S.lists=await api("/api/playlists",{op:"folder_rename",id,name});renderTree();}
async function delPl(id){if(!confirm("이 재생목록을 삭제할까요?"))return;S.lists=await api("/api/playlists",{op:"delete",id});if(S.view.kind==="pl"&&S.view.id===id)S.view={kind:"lib"};render();}
async function delFolder(id){if(!confirm("폴더를 삭제할까요? (안의 목록은 상위로 옮겨집니다)"))return;S.lists=await api("/api/playlists",{op:"folder_delete",id});renderTree();}
function movePl(id){menu({clientX:280,clientY:140},[["(폴더 없음)",async()=>{S.lists=await api("/api/playlists",{op:"move",id,folder:null});render();}]].concat(S.lists.folders.map((f)=>[f.name,async()=>{S.lists=await api("/api/playlists",{op:"move",id,folder:f.id});render();}])));}
$("btnNewList").onclick=()=>newList(null);$("btnNewFolder").onclick=()=>newFolder(null);

/* ── 갱신·보고·설정 ── */
$("btnSync").onclick=async()=>{$("btnSync").disabled=true;const r=await api("/api/sync",{});$("btnSync").disabled=false;await refreshState();await loadAll();await loadLog();if(!r.ok)alert("갱신 실패: "+(r.steps.find((s)=>!s.ok)?.error||"")+"\n"+(r.steps.find((s)=>!s.ok)?.message||""));};
$("btnReport").onclick=async()=>{const d=await api("/api/normalize");const s=d.summary;$("repMeta").textContent=`${s.count}곡 · 인식 ${s.count-s.other} · 기타 ${s.other}`;$("repBody").textContent=d.rows.map((r)=>`${r.bucket==="other"?"기타":"인식"} ${r.rule.padEnd(6)} | ${r.title}\n      → 아티스트 [${r.artist}] 곡 [${r.song}]${r.variant?` 변형 ${r.variant}`:""}${r.tags.length?` 태그 ${r.tags.join(",")}`:""}${r.removed.length?` 제거 ${r.removed.join(" ")}`:""}`).join("\n");$("rep").showModal();};
let sInst="";
$("btnSettings").onclick=async()=>{const d=await api("/api/settings");const s=d.settings;$("sCli").value=s.cli_exe||"";$("sGap").value=s.gap_sec;$("sMargin").value=s.advance_margin;$("sStop").checked=!!s.stop_before_play;$("sAuto").checked=!!s.auto_sync;sInst=s.default_inst||"";
  ddMake($("sInstDd"),instItems,()=>sInst,(v)=>{sInst=v;});$("sCliHint").textContent=d.cli.found?`감지된 경로: ${d.cli.exe} · ${d.cli.pipe==="connected"?"연결됨":"끊김 "+(d.cli.reason||"")}`:"실행파일을 찾지 못했습니다";$("set").showModal();};
$("sSave").onclick=async()=>{const r=await api("/api/settings",{settings:{cli_exe:$("sCli").value.trim(),gap_sec:Number($("sGap").value)||0,advance_margin:Number($("sMargin").value)||0,default_inst:sInst,stop_before_play:$("sStop").checked,auto_sync:$("sAuto").checked}});S.settings=r.settings;$("sCliHint").textContent=r.cli.found?`감지된 경로: ${r.cli.exe} · ${r.cli.pipe==="connected"?"연결됨":"끊김"}`:"실행파일을 찾지 못했습니다";$("set").close();await refreshState();renderMid();};
$("sTest").onclick=async()=>{await api("/api/settings",{settings:{cli_exe:$("sCli").value.trim()}});const d=await api("/api/settings");$("sCliHint").textContent=d.cli.found?`감지된 경로: ${d.cli.exe} · ${d.cli.pipe==="connected"?"연결됨":"끊김 "+(d.cli.reason||"")}`:"실행파일을 찾지 못했습니다";await refreshState();};

/* ── 시작 ── */
(async()=>{ddMake($("instDd"),instItems,()=>S.instrument,(v)=>{S.instrument=v;});const st=await refreshState();await loadAll();await loadLog();
  if(S.settings.auto_sync&&S.cliOk){$("btnSync").click();}
  setInterval(refreshState,15000);setInterval(loadLog,6000);})();
</script>
</body>
</html>
