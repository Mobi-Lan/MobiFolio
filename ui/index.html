<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모비폴리오</title>
<link rel="icon" type="image/svg+xml" href="MobiFolio.svg">
<script>try{const t=localStorage.getItem("mobifolio.theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<style>
:root{--mono:ui-monospace,Consolas,monospace;--bg:#101114;--panel:#0d1117;--panel2:#0b0f14;--card:#141a22;--card2:#182130;--line:#26303d;--line2:#1c2430;--ink:#e9ecf1;--ink2:#c9d0da;--strong:#f4e7c8;--muted:#9aa3b2;--faint:#6f7a8a;--faint2:#4b5665;--gold:#e2b866;--gold2:#c9a962;--golddim:#a8833f;--goldline:#6b5426;--green:#5fc7a4;--pink:#e88aa6;--blue:#7aa2e8;--ok:#4ade80;--hover:#1a2230;--ongold:var(--ongold);--goldhover:var(--goldhover);--track:#1c2430;--ddhover:#3a4756;--tile1:#1b2231;--tile2:#141a22;--shadow:var(--shadow);--bulkhover:var(--bulkhover);--scroll:#26303d;--goldwash:var(--goldwash);color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#eef0f3;--panel:#ffffff;--panel2:#f6f7f9;--card:#ffffff;--card2:#e9edf2;--line:#d3d9e2;--line2:#e4e8ee;--ink:#1b2230;--ink2:#3a4556;--strong:#2f2406;--muted:#5d6979;--faint:#8792a2;--faint2:#b6bec9;--gold:#b07f14;--gold2:#8f6810;--golddim:#6f510c;--goldline:#dcc48c;--green:#1e9772;--pink:#c64d77;--blue:#3567c9;--ok:#1f9d55;--hover:#eaeef3;--ongold:#ffffff;--goldhover:#9a6f0f;--track:#dde2e9;--ddhover:#aeb9c7;--tile1:#ffffff;--tile2:#e9edf2;--shadow:rgba(20,30,45,.18);--bulkhover:rgba(0,0,0,.04);--scroll:#c4cbd6;--goldwash:rgba(176,127,20,.10);color-scheme:light}}
:root[data-theme="light"]{--bg:#eef0f3;--panel:#ffffff;--panel2:#f6f7f9;--card:#ffffff;--card2:#e9edf2;--line:#d3d9e2;--line2:#e4e8ee;--ink:#1b2230;--ink2:#3a4556;--strong:#2f2406;--muted:#5d6979;--faint:#8792a2;--faint2:#b6bec9;--gold:#b07f14;--gold2:#8f6810;--golddim:#6f510c;--goldline:#dcc48c;--green:#1e9772;--pink:#c64d77;--blue:#3567c9;--ok:#1f9d55;--hover:#eaeef3;--ongold:#ffffff;--goldhover:#9a6f0f;--track:#dde2e9;--ddhover:#aeb9c7;--tile1:#ffffff;--tile2:#e9edf2;--shadow:rgba(20,30,45,.18);--bulkhover:rgba(0,0,0,.04);--scroll:#c4cbd6;--goldwash:rgba(176,127,20,.10);color-scheme:light}
:root[data-theme="dark"]{--bg:#101114;--panel:#0d1117;--panel2:#0b0f14;--card:#141a22;--card2:#182130;--line:#26303d;--line2:#1c2430;--ink:#e9ecf1;--ink2:#c9d0da;--strong:#f4e7c8;--muted:#9aa3b2;--faint:#6f7a8a;--faint2:#4b5665;--gold:#e2b866;--gold2:#c9a962;--golddim:#a8833f;--goldline:#6b5426;--green:#5fc7a4;--pink:#e88aa6;--blue:#7aa2e8;--ok:#4ade80;--hover:#1a2230;--ongold:var(--ongold);--goldhover:var(--goldhover);--track:#1c2430;--ddhover:#3a4756;--tile1:#1b2231;--tile2:#141a22;--shadow:var(--shadow);--bulkhover:var(--bulkhover);--scroll:#26303d;--goldwash:var(--goldwash);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 "IBM Plex Sans KR","Pretendard","Malgun Gothic",system-ui,sans-serif;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto}
*::-webkit-scrollbar{width:10px;height:10px}*::-webkit-scrollbar-track{background:transparent}*::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:8px;border:3px solid transparent;background-clip:padding-box}*::-webkit-scrollbar-thumb:hover{background:#3a4756;background-clip:padding-box;border:3px solid transparent}
button{font:inherit;color:var(--ink2);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
button:hover{background:var(--card2);color:var(--strong)}
button.pri{background:var(--gold);color:var(--ongold);border-color:transparent;font-weight:600}button.pri:hover{background:var(--goldhover)}
button.ghost{border-color:transparent;color:var(--muted)}
button.small{padding:3px 8px;font-size:12px;border-radius:6px}
button.ic{width:30px;height:30px;padding:0;justify-content:center}
button.ic.dim{color:var(--faint)}
button.tb{width:34px;height:34px;padding:0;justify-content:center;border-radius:8px;position:relative}
button.tb.big{width:44px;height:44px;border-radius:11px;background:var(--gold);color:var(--ongold);border-color:transparent}button.tb.big:hover{background:var(--goldhover)}
button.tb.on{border-color:var(--goldline);color:var(--gold)}
button:disabled{opacity:.4;cursor:default}
input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
input:focus,textarea:focus{outline:none;border-color:var(--goldline)}
input[type=checkbox]{width:14px;height:14px;accent-color:var(--gold);margin:0}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
svg.i.s{width:14px;height:14px;stroke-width:1.8}svg.i.l{width:20px;height:20px}
.top{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line2);background:var(--panel)}
.brand{display:flex;flex-direction:column;line-height:1.05;margin-right:6px;display:flex;align-items:center;gap:9px}.brand>span{display:flex;flex-direction:column}.brand .logo{width:30px;height:30px;border-radius:7px;flex-shrink:0}.brand small{font-size:9.5px;letter-spacing:.16em;color:var(--golddim)}.brand b{font-size:16px}
.grow{flex:1}
.status{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}.dot.on{background:var(--ok);box-shadow:0 0 7px var(--ok)}.dot.off{background:var(--pink)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:250px 1fr 320px;gap:12px;padding:12px 16px;min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.chd{display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid var(--line2);font-weight:600;flex-wrap:wrap}
.chd .m{font-size:12px;color:var(--muted);font-weight:400}
.cbd{padding:10px 12px;overflow:auto;min-height:0;flex:1}
.sec{font-size:11px;letter-spacing:.1em;color:var(--gold2);margin:8px 0 3px;display:flex;align-items:center;gap:6px;padding:0 4px}
.sec .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:0}
.tree .it{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--ink2)}
.tree .it:hover{background:var(--hover)}.tree .it.on{background:var(--card2);color:var(--strong);font-weight:600}
.tree .it .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tree .it .cnt{font-family:var(--mono);font-size:11px;color:var(--faint)}.tree .it.on .cnt{color:var(--gold)}
.tree .sub{margin-left:12px;border-left:1px solid var(--line2);padding-left:5px}
.tree .it.auto{color:var(--muted)}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden;font-size:12px}
.seg span{padding:4px 10px;color:var(--muted);cursor:pointer;white-space:nowrap}.seg span:hover{color:var(--ink2)}.seg span.on{background:var(--gold);color:var(--ongold);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:7px;border:1px solid var(--line);color:var(--muted);cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--ink2)}.chip.on{border-color:var(--goldline);color:var(--strong);background:rgba(226,184,102,.1)}
.idx{display:flex;flex-wrap:wrap;gap:2px}.idx span{font-family:var(--mono);font-size:11px;padding:2px 5px;border-radius:5px;color:var(--muted);cursor:pointer}.idx span:hover{color:var(--ink2)}.idx span.on{background:var(--gold);color:var(--ongold);font-weight:600}.idx span.zero{opacity:.3;cursor:default}
.badge{font-size:10.5px;padding:1px 6px;border-radius:4px;font-weight:600;white-space:nowrap;margin-left:6px}
.badge.dup{background:rgba(232,138,166,.16);color:var(--pink)}.badge.play{background:rgba(226,184,102,.16);color:var(--gold)}.badge.man{border:1px solid var(--line);color:var(--muted);font-weight:500}.badge.tag{background:rgba(122,162,232,.14);color:var(--blue)}.badge.var{background:rgba(95,199,164,.14);color:var(--green)}.badge.eq{background:rgba(95,199,164,.14);color:var(--green);font-weight:500}
.row{display:grid;grid-template-columns:16px 22px 1fr 140px 48px 100px;gap:10px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line2);cursor:pointer;user-select:none}
.row.pl{grid-template-columns:14px 16px 22px 1fr 130px 132px 48px 100px}
.row:hover{background:var(--hover)}.row.sel{background:rgba(226,184,102,.07)}
.row .no{font-family:var(--mono);font-size:11px;color:var(--faint)}
.row .ttl{display:flex;flex-direction:column;gap:1px;min-width:0}
.row .ttl b{display:flex;align-items:center;gap:0;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;min-width:0}
.row .ttl b .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:0 1 auto}
.row .ttl small{font-size:11.5px;color:var(--faint);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:text}
.row .art{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;justify-self:stretch}
.row .len{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right}
.row .acts{display:flex;gap:5px}
.row .grip{color:var(--faint2);cursor:grab}.row.dragging{opacity:.4}.row.over{box-shadow:inset 0 2px 0 var(--gold)}.row.over.after{box-shadow:inset 0 -2px 0 var(--gold)}
.hd{font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line);cursor:default}.hd:hover{background:transparent}.row.hd{position:sticky;top:0;z-index:2;background:var(--card)}.row.hd:hover{background:var(--card)}#mid{padding-top:0}
.empty{color:var(--faint);text-align:center;padding:24px 10px;font-size:13px}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.kv{display:grid;grid-template-columns:62px 1fr;gap:5px 10px;font-size:12.5px}.kv .k{color:var(--muted)}.kv .v{color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd{position:relative;min-width:0}
.dd-btn{width:100%;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink);cursor:pointer;text-align:left;font-size:13px}
.dd-btn:hover{border-color:var(--ddhover);background:var(--panel)}.dd-btn.open{border-color:var(--goldline)}
.dd-btn .lb{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-btn .chev{width:13px;height:13px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}.dd-btn.open .chev{transform:rotate(180deg)}
.dd-list{position:fixed;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;max-height:300px;overflow:auto;box-shadow:0 12px 32px var(--shadow)}
.dd-item{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--ink2)}.dd-item:hover{background:var(--card2);color:var(--strong)}.dd-item.on{color:var(--strong)}
.dd-item .ck{width:14px;height:14px;stroke:var(--gold);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;visibility:hidden;flex-shrink:0}.dd-item.on .ck{visibility:visible}
.dd-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-sep{height:1px;background:var(--line2);margin:5px 4px}
.bar{display:grid;grid-template-columns:minmax(220px,300px) 1fr minmax(260px,340px);align-items:center;gap:16px;padding:9px 16px 10px;border-top:1px solid var(--line);background:var(--panel2)}
.tile{width:44px;height:44px;border-radius:9px;border:1px solid var(--goldline);background:linear-gradient(180deg,var(--tile1),var(--tile2));display:flex;align-items:center;justify-content:center;color:var(--gold);flex-shrink:0}
.track{height:5px;background:var(--track);border-radius:3px;overflow:hidden}.track>i{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width .4s linear}
.log{display:grid;grid-template-columns:48px 1fr auto;gap:8px;align-items:center;padding:7px 9px;border-radius:8px;border:1px solid var(--line2);cursor:pointer}
.log.ok{background:rgba(74,222,128,.06);border-color:rgba(74,222,128,.22)}.log.warn{background:rgba(232,138,166,.06);border-color:rgba(232,138,166,.3)}
.log .ts{font-family:var(--mono);font-size:10.5px;color:var(--muted)}.log .msg{font-size:12.5px;display:flex;flex-direction:column;gap:0;min-width:0}.log .msg small{font-size:10.5px;color:var(--muted);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log .st{font-size:10.5px;padding:2px 6px;border-radius:4px;font-weight:600;background:var(--line);color:var(--ink2)}.log.ok .st{background:var(--ok);color:#0a2a12}.log.warn .st{background:var(--pink);color:#2a0a12}
.raw{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:pre-wrap;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:8px;max-height:200px;overflow:auto;word-break:break-all}
.bulk{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 10px;margin:0 0 8px;background:var(--goldwash);border:1px solid var(--goldline);border-radius:9px;font-size:12.5px;color:var(--strong)}
.bulk button{background:transparent;border-color:rgba(201,208,218,.22);color:var(--ink2);font-weight:500}
.bulk button:hover{background:var(--bulkhover);border-color:rgba(226,184,102,.45);color:var(--strong)}
.bulk button.pri{background:var(--gold);color:var(--ongold);border-color:transparent;font-weight:600}
.bulk button.ghost{background:transparent;border-color:rgba(201,208,218,.18);color:var(--ink2)}
.plhead{display:flex;align-items:flex-start;gap:14px;padding:14px 14px 12px;border-bottom:1px solid var(--line2)}
.plhead .tile{width:64px;height:64px;border-radius:12px}
.plhead .name{font-size:20px;font-weight:700;color:var(--strong);line-height:1.2;cursor:text}
.plhead .memo{font-size:12px;color:var(--ink2);cursor:text}.plhead .memo.empty{color:var(--faint)}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(360px,92vw);max-width:92vw}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:60;background:rgba(232,138,166,.14);border:1px solid rgba(232,138,166,.45);color:var(--strong);padding:8px 14px;border-radius:9px;font-size:12.5px;max-width:80vw;box-shadow:0 10px 30px var(--shadow)}dialog::backdrop{background:var(--shadow)}
.menu{position:fixed;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px;z-index:40;min-width:200px;max-height:60vh;overflow:auto;box-shadow:0 10px 30px var(--shadow)}
.menu div{padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap}.menu div:hover{background:var(--card2)}.menu .hd{color:var(--faint);font-size:11px;cursor:default}.menu .hd:hover{background:transparent}
.frm{display:grid;grid-template-columns:150px 1fr;gap:10px 12px;align-items:center;font-size:13px}.frm label{color:var(--muted)}.frm .hint{grid-column:2;font-size:11.5px;color:var(--faint);margin-top:-6px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="ic-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol><symbol id="ic-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
<symbol id="ic-prev" viewBox="0 0 24 24"><path d="M6 5v14M19 5l-11 7 11 7z"/></symbol><symbol id="ic-next" viewBox="0 0 24 24"><path d="M18 5v14M5 5l11 7-11 7z"/></symbol>
<symbol id="ic-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></symbol><symbol id="ic-repeat" viewBox="0 0 24 24"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></symbol>
<symbol id="ic-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="ic-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></symbol>
<symbol id="ic-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol><symbol id="ic-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
<symbol id="ic-grip" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></symbol>
<symbol id="ic-note" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol><symbol id="ic-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
<symbol id="ic-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 4v4h4"/></symbol><symbol id="ic-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
<symbol id="ic-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol><symbol id="ic-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
<symbol id="ic-doc" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></symbol><symbol id="ic-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="ic-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></symbol><symbol id="ic-ck" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
</defs></svg>

<div class="top">
  <div class="brand"><img src="MobiFolio.svg" alt="" class="logo"><span><small>MABINOGI MOBILE FAN PROJECT</small><b>MobiFolio</b></span></div>
  <span class="grow"></span>
  <span class="status"><span class="dot" id="cliDot"></span><span id="cliText">CLI 확인 중</span></span>
  <span class="status" id="fetched">—</span>
  <button class="ghost small" id="btnReport"><svg class="i s"><use href="#ic-doc"/></svg>정규화 보고</button>
  <button class="ghost small" id="themeBtn" title="테마: 자동(OS 설정) → 다크 → 라이트">테마: 자동</button>
  <button class="ghost small" id="btnSettings"><svg class="i s"><use href="#ic-gear"/></svg>설정</button>
  <button class="pri" id="btnSync"><svg class="i s"><use href="#ic-refresh"/></svg>갱신</button>
</div>

<div class="grid">
  <div class="card"><div class="chd">보관함<span class="grow"></span><button class="small ghost" id="btnNewFolder"><svg class="i s"><use href="#ic-folder"/></svg>폴더</button><button class="small pri" id="btnNewList"><svg class="i s"><use href="#ic-plus"/></svg>목록</button></div><div class="cbd tree" id="tree"></div></div>

  <div class="card">
    <div id="midHead"></div>
    <div class="cbd" id="mid"></div>
  </div>

  <div style="display:flex;flex-direction:column;gap:12px;min-height:0">

  <div class="frm">
    <label>CLI 실행파일 경로</label><input id="sCli" placeholder="비우면 자동 탐색 (C:\Nexon\MabinogiMobile\MabinogiMobile_CLI.exe → PATH)">
    <span class="hint" id="sCliHint">—</span>

</dialog>

<script>
const $=(id)=>document.getElementById(id);
const TOKEN="__MOBIFOLIO_TOKEN__";   // 서버가 index.html 을 낼 때 실행 토큰으로 바꿔 넣는다 (배포판)
$("dlgCancel").onclick=()=>$("dlg").close("cancel");
const api=async(path,body)=>{try{const r=await fetch(path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json","X-Requested-With":"mobifolio","X-MobiFolio-Token":TOKEN},body:body?JSON.stringify(body):undefined});const j=await r.json();if(j&&typeof j==="object"&&!("ok"in j)&&r.ok)return j;if(!r.ok&&j&&typeof j==="object"&&!("ok"in j))j.ok=false;return j;}catch(e){return {ok:false,error:"network",message:String(e.message||e)};}};
function toast(msg,ms=5000){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>{t.hidden=true;},ms);}
window.addEventListener("unhandledrejection",(e)=>{toast("오류: "+(e.reason&&e.reason.message||e.reason||"알 수 없음"));});
window.addEventListener("error",(e)=>{toast("오류: "+(e.message||"알 수 없음"));});
const esc=(s)=>String(s??"").replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const INDEX="ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎABCDEFGHIJKLMNOPQRSTUVWXYZ#";
const fmtSec=(s)=>{s=Math.max(0,Math.floor(s||0));return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;};
const fmtTs=(t)=>t?new Date(t*1000).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
const fmtClock=(t)=>{const d=new Date(t*1000);return [d.getHours(),d.getMinutes(),d.getSeconds()].map((n)=>String(n).padStart(2,"0")).join(":");};
const ICON=(n,c="")=>`<svg class="i ${c}"><use href="#ic-${n}"/></svg>`;
let S={all:[],byTitle:new Map(),summary:{artists:[],other:0,count:0,byInitial:{}},lists:{folders:[],playlists:[]},instruments:[],settings:{},
  view:{kind:"lib"},q:"",initial:"",filter:"",sort:"rel",artSort:"count",artQ:"",selected:new Set(),sel:null,
  queue:[],order:[],qi:-1,src:"",shuffle:false,repeat:"off",now:null,playing:false,pollT:null,startedAt:0,advancing:false,manualStop:false,gapT:null,
  instrument:"",rawOpen:false,logs:[]};

function ask(title,def=""){return new Promise((res)=>{$("dlgTitle").textContent=title;$("dlgInput").value=def;$("dlg").returnValue="";$("dlg").onclose=()=>res($("dlg").returnValue==="ok"?$("dlgInput").value.trim():null);$("dlg").showModal();$("dlgInput").select();});}
function menu(e,items){closeFloating();const m=document.createElement("div");m.className="menu";const x=Math.min(e.clientX??e.pageX,window.innerWidth-230);
  m.innerHTML=items.map(([t,fn])=>`<div class="${fn?"":"hd"}">${esc(t)}</div>`).join("");[...m.children].forEach((c,i)=>{if(items[i][1])c.onclick=()=>{m.remove();items[i][1]();};});document.body.appendChild(m);
  const h=m.offsetHeight,y0=e.clientY??e.pageY;let y=Math.min(y0,window.innerHeight-h-10);if(y<10)y=10;m.style.left=x+"px";m.style.top=y+"px";m.style.maxHeight=(window.innerHeight-y-10)+"px";
  setTimeout(()=>document.addEventListener("click",()=>m.remove(),{once:true}),0);}
// 열려 있는 드롭다운·메뉴를 전부 닫는다 (문서 수준 리스너 하나로 관리 — 렌더마다 리스너가 쌓이지 않게)
function closeFloating(){document.querySelectorAll(".menu").forEach((m)=>m.remove());document.querySelectorAll(".dd-list:not([hidden])").forEach((l)=>{l.hidden=true;const b=l.parentElement&&l.parentElement.querySelector(".dd-btn");if(b)b.classList.remove("open");});}
window.addEventListener("resize",closeFloating);document.addEventListener("scroll",(ev)=>{if(ev.target instanceof Element&&ev.target.closest(".dd-list,.menu"))return;closeFloating();},true);
document.addEventListener("keydown",(ev)=>{if(ev.key==="Escape"){const open=document.querySelector(".dd-list:not([hidden]),.menu");if(open){closeFloating();ev.preventDefault();ev.stopPropagation();}}},true);

/* ── 드롭다운 (범용) ── */
function ddMake(el,getItems,getVal,setVal){
  el.innerHTML=`<button type="button" class="dd-btn"><span class="lb"></span><svg class="chev"><use href="#ic-chev"/></svg></button><div class="dd-list" hidden></div>`;
  const btn=el.querySelector(".dd-btn"),list=el.querySelector(".dd-list"),lb=el.querySelector(".lb");
  const label=()=>{const it=getItems().find((x)=>x.v===getVal());lb.innerHTML=it?esc(it.label)+(it.eq?' <span class="badge eq">장착</span>':""):esc(getItems()[0]?.label||"");btn.title=it?it.label:"";};
  const close=()=>{list.hidden=true;btn.classList.remove("open");};
  const open=()=>{closeFloating();const items=getItems();list.innerHTML=items.map((it,k)=>`${it.sep?'<div class="dd-sep"></div>':""}<div class="dd-item ${getVal()===it.v?"on":""}" data-v="${esc(it.v)}" tabindex="0"><svg class="ck"><use href="#ic-ck"/></svg><span class="nm">${esc(it.label)}</span>${it.eq?'<span class="badge eq">장착</span>':""}</div>`).join("");
    list.querySelectorAll(".dd-item").forEach((n)=>{const pick=async(ev)=>{ev.stopPropagation();close();await setVal(n.dataset.v);label();};n.onclick=pick;n.onkeydown=(ev)=>{if(ev.key==="Enter"||ev.key===" ")pick(ev);};});
    const r=btn.getBoundingClientRect();list.style.left=r.left+"px";list.style.width=Math.max(r.width,200)+"px";list.style.visibility="hidden";list.hidden=false;
    const h=list.offsetHeight,below=window.innerHeight-r.bottom-10,above=r.top-10;
    if(h<=below||below>=above){list.style.top=(r.bottom+6)+"px";list.style.bottom="auto";list.style.maxHeight=Math.min(300,below)+"px";}   // 아래로
    else{list.style.top="auto";list.style.bottom=(window.innerHeight-r.top+6)+"px";list.style.maxHeight=Math.min(300,above)+"px";}       // 공간 없으면 위로 (하단 재생 바)
    list.style.visibility="";btn.classList.add("open");
    setTimeout(()=>document.addEventListener("click",function h(ev){if(!el.contains(ev.target)){close();}else if(!list.hidden)document.addEventListener("click",h,{once:true});},{once:true}),0);};
  btn.onclick=(ev)=>{ev.stopPropagation();list.hidden?open():close();};
  el._refresh=label;label();return {refresh:label};
}
const instLabel=(i)=>(i.cliBroken?"⚠ ":"")+i.name;   // ⚠ = 게임 CLI 가 이름 끝 공백 때문에 못 바꾸는 악기 (게임에서 직접 장착해야 함)
const instItems=()=>[{v:"",label:S.settings.default_inst?`기본 악기 (${S.settings.default_inst})`:"악기 그대로"}].concat(S.instruments.map((i,k)=>({v:i.name,label:instLabel(i),eq:i.equipped,sep:k===0})));
const instItemsSet=()=>[{v:"",label:"지정 안 함 (장착 악기 그대로)"}].concat(S.instruments.map((i,k)=>({v:i.name,label:instLabel(i),eq:i.equipped,sep:k===0})));

/* ── 데이터 로드 ── */
async function refreshState(){const s=await api("/api/state");
  if(!s||!s.scores){$("cliDot").className="dot off";$("cliText").textContent="백엔드 응답 없음 — 앱을 다시 실행하세요";S.cliOk=false;if(!S.all.length)setTimeout(loadAll,5000);return s;}
  const c=s.cli||{};$("cliDot").className="dot "+(c.found?(c.pipe==="connected"?"on":"off"):"");S.cliOk=c.found&&c.pipe==="connected";
  $("cliText").textContent=!c.found?"CLI 없음 — 설정에서 경로 지정 또는 인게임 토글":(c.pipe==="connected"?"CLI 연결됨":`CLI 끊김 ${c.reason||c.status_error||""}`);
  $("fetched").textContent=`악보 ${s.scores.count} · 악기 ${s.instruments.count} · 수신 ${fmtTs(s.scores.fetched_at)}`;return s;}
async function loadAll(){const [sc,ls,ar,ins,st]=await Promise.all([api("/api/scores"),api("/api/playlists"),api("/api/artists"),api("/api/instruments"),api("/api/settings")]);
  if(!sc||!sc.items||!ls||!ls.playlists||!ar||!ar.artists||!ins||!ins.items||!st||!st.settings){toast("서버에서 데이터를 받지 못했습니다 — 백엔드 상태를 확인하세요 ("+((sc&&sc.message)||(ls&&ls.message)||"")+")");return;}
  S.all=sc.items;S.byTitle=new Map(sc.items.map((i)=>[i.title,i]));S.summary={...sc.summary,artists:ar.artists,other:ar.other};S.lists=ls;S.instruments=ins.items;S.settings=st.settings;
  if(S.instrument&&!S.instruments.some((i)=>i.name===S.instrument))S.instrument="";$("instDd")._refresh&&$("instDd")._refresh();render();}
async function listsApi(body){const r=await api("/api/playlists",body);if(r&&r.playlists){S.lists=r;}if(!r||r.ok===false){toast("재생목록 저장 실패: "+(r&&(r.message||r.error)||"서버 응답 없음"));}return r;}
async function loadLog(){const d=await api("/api/log");S.logs=d.items;renderLog();}

/* ── 렌더: 레일 ── */
function refreshQueue(){ // 재생 중인 재생목록(src="pl:<id>")이 편집되면 큐도 그 목록을 따라간다 (삭제된 곡은 안 틀고, 순서·악기 변경 반영)
  if(!S.src||!S.src.startsWith("pl:"))return;const pl=S.lists.playlists.find((x)=>"pl:"+x.id===S.src);if(!pl)return;
  const cur=S.queue[S.qi];const q=pl.items.map((x)=>({title:x.title,inst:x.inst||""}));if(JSON.stringify(q)===JSON.stringify(S.queue))return;
  const oldQueue=S.queue,oldQi=S.qi;S.queue=q;S.qi=cur?q.findIndex((x)=>x.title===cur.title):-1;
  if(S.qi<0&&cur){const nxt=oldQueue.slice(oldQi+1).find((x)=>q.some((y)=>y.title===x.title));S.qi=nxt?q.findIndex((x)=>x.title===nxt.title)-1:q.length-1;}   // 빠진 곡의 '다음 곡' 직전 위치 (-1 = 첫 곡 앞)
  if(S.shuffle&&oldQueue.length===q.length&&oldQueue.every((x,i)=>x.title===q[i].title)){return;}   // 악기만 바뀐 편집이면 셔플 순서 유지
  makeOrder();}
function render(){refreshQueue();renderTree();renderMid();renderSel();renderQueue();}
function renderTree(){
  const {folders,playlists}=S.lists,v=S.view,el=$("tree");
  const byParent=(pid)=>folders.filter((f)=>(f.parent||null)===pid),plsIn=(fid)=>playlists.filter((p)=>(p.folder||null)===fid);
  const plRow=(p)=>`<div class="it ${v.kind==="pl"&&v.id===p.id?"on":""}" data-pl="${p.id}">${ICON(S.src==="pl:"+p.id&&S.playing?"play":"list","s")}<span class="nm">${esc(p.name)}</span><span class="cnt">${p.items.length}</span></div>`;
  const fold=(fid)=>byParent(fid).map((f)=>`<div class="it" data-f="${f.id}">${ICON("folder","s")}<span class="nm">${esc(f.name)}</span><span class="cnt">${plsIn(f.id).length}</span></div><div class="sub">${plsIn(f.id).map(plRow).join("")}${fold(f.id)}</div>`).join("");
  const recentN=S.all.filter((i)=>i.lastPlayed).length;
  if(document.activeElement&&document.activeElement.id==="artQ"&&$("artList")){renderArtList();return;}   // 검색 입력 중엔 목록만 갱신 (IME 조합 유지)
  el.innerHTML=`<div class="sec">보관함</div>
    <div class="it ${v.kind==="lib"?"on":""}" data-view="lib">${ICON("note","s")}<span class="nm">전체 악보</span><span class="cnt">${S.summary.count||0}</span></div>
    <div class="it ${v.kind==="recent"?"on":""}" data-view="recent">${ICON("clock","s")}<span class="nm">최근 재생</span><span class="cnt">${recentN}</span></div>
    <div class="it ${v.kind==="other"?"on":""}" data-view="other">${ICON("user","s")}<span class="nm">기타 · 미분류</span><span class="cnt" style="color:var(--pink)">${S.summary.other||0}</span></div>
    <div class="sec">재생목록<span class="cnt">${playlists.length}</span></div>${plsIn(null).map(plRow).join("")}${fold(null)}${playlists.length||folders.length?"":`<div class="note" style="padding:6px 8px;border:1px dashed var(--line);border-radius:8px;margin:2px 4px;text-align:center">「+ 목록」이나 곡의 +로 만드세요</div>`}
    <div class="sec">아티스트<span class="cnt">${(S.summary.artists||[]).length}</span><span class="seg" style="font-size:10.5px;margin-left:6px"><span class="${S.artSort==="count"?"on":""}" data-as="count">곡수</span><span class="${S.artSort==="name"?"on":""}" data-as="name">이름</span></span></div>
    <div style="display:flex;align-items:center;gap:6px;padding:5px 8px;margin:2px 2px 4px;border:1px solid var(--line);border-radius:7px;background:var(--panel)">${ICON("search","s")}<input id="artQ" placeholder="아티스트 검색" value="${esc(S.artQ)}" style="border:none;background:transparent;padding:0;flex:1;font-size:12px;min-width:0"></div>
    <div id="artList"></div>`;
  renderArtList();
  el.querySelectorAll("[data-view]").forEach((n)=>n.onclick=()=>setView({kind:n.dataset.view}));
  el.querySelectorAll("[data-pl]").forEach((n)=>{n.onclick=()=>setView({kind:"pl",id:n.dataset.pl});n.oncontextmenu=(e)=>{e.preventDefault();plMenu(e,n.dataset.pl);};});
  el.querySelectorAll("[data-f]").forEach((n)=>{n.oncontextmenu=(e)=>{e.preventDefault();menu(e,[["이름 변경",()=>renameFolder(n.dataset.f)],["하위 폴더",()=>newFolder(n.dataset.f)],["여기에 목록",()=>newList(n.dataset.f)],["폴더 삭제",()=>delFolder(n.dataset.f)]]);};});
  el.querySelectorAll("[data-as]").forEach((n)=>n.onclick=(e)=>{e.stopPropagation();S.artSort=n.dataset.as;renderTree();});
  const aq=$("artQ");aq.oninput=()=>{S.artQ=aq.value;renderArtList();};
}
function renderArtList(){const v=S.view,box=$("artList");if(!box)return;
  let arts=S.summary.artists||[];if(S.artQ){const q=S.artQ.toLowerCase();arts=arts.filter((a)=>a.name.toLowerCase().includes(q));}
  arts=S.artSort==="name"?[...arts].sort((a,b)=>a.name.localeCompare(b.name,"ko")):arts;
  box.innerHTML=arts.map((a)=>`<div class="it ${a.manual?"":"auto"} ${v.kind==="artist"&&v.key===a.key?"on":""}" data-ar="${esc(a.key)}" title="${a.manual?"등록된 아티스트":"제목에서 자동 추출 — 우클릭으로 등록·별칭·합치기"}"><span style="color:var(--gold);font-size:10px;width:10px;text-align:center">${a.manual?"★":"·"}</span><span class="nm">${esc(a.name)}</span><span class="cnt">${a.count}</span></div>`).join("")||(S.artQ?`<div class="note" style="padding:4px 10px">없음</div>`:"");
  box.querySelectorAll("[data-ar]").forEach((n)=>{n.onclick=()=>setView({kind:"artist",key:n.dataset.ar});n.oncontextmenu=(e)=>{e.preventDefault();artistMenu(e,n.dataset.ar);};});}
function setView(v){S.view=v;S.selected.clear();S.initial="";S.filter="";renderTree();renderMid();}

/* ── 렌더: 가운데 ── */
function currentItems(){
  const v=S.view;let items=S.all;
  if(v.kind==="pl"){const pl=S.lists.playlists.find((p)=>p.id===v.id);return pl?pl.items.map((it,k)=>({...(S.byTitle.get(it.title)||{title:it.title,song:it.title,cleaned:it.title,artist:"",tags:[],missing:true}),plInst:it.inst,plIndex:k})):[];}
  if(v.kind==="recent")items=items.filter((i)=>i.lastPlayed);
  if(v.kind==="other")items=items.filter((i)=>i.bucket==="other");
  if(v.kind==="artist")items=items.filter((i)=>i.artistKey===v.key);
  if(S.q){const qt=S.q.toLowerCase().split(/\s+/).filter(Boolean);items=items.filter((i)=>qt.every((t)=>(i.norm||"").includes(t.replace(/[\s\-_.]/g,""))||(i.artist||"").toLowerCase().includes(t)||(i.title||"").toLowerCase().includes(t)));}
  if(S.initial)items=items.filter((i)=>i.initial===S.initial);
  if(S.filter==="artist")items=items.filter((i)=>i.bucket==="artist");if(S.filter==="other")items=items.filter((i)=>i.bucket==="other");if(S.filter==="dup")items=items.filter((i)=>i.dupExact>1);if(S.filter==="manual")items=items.filter((i)=>i.manual);
  if(v.kind==="recent")items=[...items].sort((a,b)=>b.lastPlayed-a.lastPlayed);
  else if(S.sort==="title")items=[...items].sort((a,b)=>(a.song||a.title).localeCompare(b.song||b.title,"ko"));
  else if(S.sort==="artist")items=[...items].sort((a,b)=>(a.artist||"힣").localeCompare(b.artist||"힣","ko")||(a.song||"").localeCompare(b.song||"","ko"));
  else if(S.sort==="recent")items=[...items].sort((a,b)=>(b.lastPlayed||0)-(a.lastPlayed||0));
  return items;
}

    <div style="display:flex;gap:6px"><button class="pri" style="flex:1;justify-content:center" id="selPlay">${ICON("play","s")}재생</button><button style="flex:1;justify-content:center" id="selAdd">${ICON("plus","s")}목록에</button><button style="flex:1;justify-content:center" id="selArt">${ICON("user","s")}아티스트</button></div></div>`;
  $("selPlay").onclick=()=>playFrom([{title:it.title,inst:""}],0,"single");$("selAdd").onclick=(e)=>addMenu(e,[it.title]);$("selArt").onclick=(e)=>assignMenu(e,[it.title]);

/* ── 큐·재생 ── */
function qOrder(){return S.order.length?S.order:S.queue.map((_,i)=>i);}
function qPos(){return qOrder().indexOf(S.qi);}
function makeOrder(){const idx=S.queue.map((_,i)=>i);if(!S.shuffle){S.order=idx;return;}const cur=S.qi;const rest=idx.filter((i)=>i!==cur);for(let i=rest.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]];}S.order=cur>=0?[cur,...rest]:rest;}
async function playFrom(list,index,src){if(S.switching||!list.length||index<0)return;S.queue=list.map((x)=>({title:x.title,inst:x.inst||""}));S.qi=index;S.src=src;makeOrder();await playIndex(index);}
async function playIndex(i){if(S.switching)return;clearTimeout(S.gapT);S.gapT=null;const it=S.queue[i];if(!it)return;S.switching=true;S.gen=(S.gen||0)+1;S.qi=i;S.manualStop=false;try{
  const lib=S.byTitle.get(it.title);S.now={title:it.title,inst:it.inst||S.instrument||"",song:lib?(lib.song||lib.cleaned):it.title,artist:lib?lib.artist:""};
  $("nowTitle").textContent=S.now.song;$("nowSub").textContent="전송 중…";$("prog").style.width="0%";$("tEl").textContent="0:00";$("tTot").textContent=(lib&&lib.duration)?fmtSec(lib.duration):"0:00";
  const r=await api("/api/play",{title:it.title,instrument:it.inst||S.instrument||null});
  S.playing=r.ok;S.startedAt=Date.now();S.lastRemain=null;
  if(!r.ok){const err=r.error||r.steps?.at(-1)?.error||"",msg=r.message||r.steps?.at(-1)?.message||"";
    $("nowSub").textContent="실패: "+errText(err,msg);loadLog();clearInterval(S.pollT);S.pollT=null;setMain(false);
    S.failRun=(S.failRun||0)+1;
    const fatal=["cli_not_found","disconnected","game_off","option_off","timeout","spawn_failed","network","forbidden"].includes(err);
    if(fatal||S.failRun>Math.min(3,S.queue.length)){S.failRun=0;$("nowSub").textContent="재생 실패: "+errText(err,msg);renderQueue();return;}
    if(S.queue.length>1){S.gapT=setTimeout(()=>advance(1),1500);}return;}
  S.failRun=0;setMain(true);startPoll();loadLog();renderMid();renderQueue();renderTree();}finally{S.switching=false;}}
function setMain(playing){$("mainIcon").innerHTML=`<use href="#ic-${playing?"stop":"play"}"/>`;$("nowBadge").hidden=!playing;}
const ERRK={not_found:"보관함에 없음",invalid_state:"게임이 준비되지 않음",cli_not_found:"CLI 없음",disconnected:"게임 연결 끊김",game_off:"게임 꺼짐",timeout:"응답 시간 초과",network:"서버 연결 실패",forbidden:"요청이 거부됨",empty_title:"제목 없음",internal:"서버 오류"};
const errText=(e,m)=>(m&&/[가-힣]/.test(m)?m:((ERRK[e]||e||"")+(m?" · "+m:""))).trim();   // 서버가 한국어 설명을 주면 그것만
function startPoll(){clearInterval(S.pollT);S.pollT=setInterval(pollAct,1000);}
async function advance(dir){ // dir=+1 다음, -1 이전, 0 자동(다음)
  if(S.advancing||S.switching)return;S.advancing=true;clearTimeout(S.gapT);S.gapT=null;
  try{let ord=qOrder();let pos=ord.indexOf(S.qi);
    if(S.repeat==="one"&&dir===0){await playIndex(S.qi);return;}
    pos+=dir===0?1:dir;
    if(pos>=ord.length){
      if(S.repeat==="all"){if(S.shuffle){S.qi=-1;makeOrder();ord=qOrder();}pos=0;}
      else{if(S.playing){S.manualStop=true;await api("/api/stop",{});}await stopAll(S.src.startsWith("pl:")?"재생목록 끝":"재생 끝");S.qi=ord[0]??-1;renderQueue();return;}}
    if(pos<0)pos=S.repeat==="all"?ord.length-1:0;
    await playIndex(ord[pos]);}
  finally{S.advancing=false;}}
async function stopAll(msg){clearInterval(S.pollT);S.pollT=null;clearTimeout(S.gapT);S.gapT=null;S.playing=false;setMain(false);$("nowSub").textContent=msg||"대기";$("prog").style.width="0%";renderMid();renderQueue();renderTree();}
let pollBusy=false;
async function pollAct(){
  if(S.switching||pollBusy)return;pollBusy=true;
  try{
  if(!S.playing&&!S.gapT){clearInterval(S.pollT);S.pollT=null;return;}   // 볼 게 없으면 폴링 종료 (CLI 호출 낭비 방지)
  if(!S.playing)return;   // 곡 사이 대기 중엔 CLI 를 부르지 않는다
  const gen=S.gen;const a=await api("/api/activity");if(S.switching||gen!==S.gen||!S.pollT)return;
  if(!a||!a.ok||!a.body||typeof a.body.Performance!=="object"){S.pollErr=(S.pollErr||0)+1;if(S.pollErr>=5){S.pollErr=0;await stopAll("CLI 응답 없음 — 재생 감시를 멈췄습니다");}return;}
  S.pollErr=0;const p=a.body.Performance||{};const s=S.settings;const sinceStart=(Date.now()-S.startedAt)/1000;
  if(p.IsPlaying){const cached=(S.byTitle.get(S.now?.title)||{}).duration||0;const tot=p.TotalDurationSeconds||cached||0,el=p.ElapsedSeconds||0;
    if(el>0&&S.startedAt>Date.now()-el*1000-1500)S.startedAt=Date.now()-el*1000;   // 게임의 경과와 맞춘다 (준비 동작 지연 보정)
    const localEl=(Date.now()-S.startedAt)/1000;S.lastRemain=tot?tot-el:null;
    $("nowSub").textContent=`${p.InstrumentName||""}${p.IsLoop?" · 반복 설정":""}${S.src.startsWith("pl:")?` · ${qPos()+1}/${S.queue.length}`:""}`;
    $("tEl").textContent=fmtSec(el);$("tTot").textContent=fmtSec(tot);$("prog").style.width=(tot?Math.min(100,el/tot*100):0)+"%";
    if(S.playing&&S.qi>=0&&tot&&!S.advancing&&((tot-el)<=(s.advance_margin??2)||localEl>=tot-1)){
      const r=await api("/api/stop",{});if(gen!==S.gen||S.manualStop||!S.pollT)return;   // 그 사이 사용자가 정지했으면 그만
      S.playing=false;const gap=(s.gap_sec??2)*1000;$("nowSub").textContent=`다음 곡까지 ${s.gap_sec??2}초…`;clearTimeout(S.gapT);S.gapT=setTimeout(()=>advance(0),gap);}
  }else if(S.playing){if(sinceStart<2.5)return;S.playing=false;if(S.manualStop){stopAll("정지됨");return;}
    if(S.lastRemain!=null&&S.lastRemain>(s.advance_margin??2)+5){stopAll("게임에서 정지됨");return;}   // 끝나기 한참 전에 멈춤 = 게임 쪽에서 정지
    const gap=(s.gap_sec??2)*1000;$("nowSub").textContent=S.queue.length>1||S.repeat!=="off"?`연주 종료 · ${s.gap_sec??2}초 후 다음`:"연주 종료";clearTimeout(S.gapT);S.gapT=setTimeout(()=>advance(0),gap);}
  }finally{pollBusy=false;}
}
$("btnMain").onclick=async()=>{if(S.switching)return;
  if(S.playing||S.gapT){S.manualStop=true;clearTimeout(S.gapT);S.gapT=null;S.gen=(S.gen||0)+1;const r=S.playing?await api("/api/stop",{}):{ok:true};loadLog();
    if(r.ok){await stopAll("정지됨");}else{S.manualStop=false;$("nowSub").textContent="정지 실패 — 잠시 후 다시: "+(r.message||r.error||"");}}
  else if(S.qi>=0&&S.queue[S.qi]){await playIndex(S.qi);}else if(S.sel){playFrom([{title:S.sel,inst:""}],0,"single");}};
$("btnNext").onclick=()=>{if(!S.queue.length||S.switching||S.advancing)return;clearTimeout(S.gapT);S.gapT=null;advance(1);};
$("btnPrev").onclick=async()=>{if(!S.queue.length||S.switching||S.advancing)return;clearTimeout(S.gapT);S.gapT=null;const el=(Date.now()-S.startedAt)/1000;if(S.playing&&el>4){await playIndex(S.qi);}else advance(-1);};
function toggleShuffle(){S.shuffle=!S.shuffle;makeOrder();$("btnShuffle").classList.toggle("on",S.shuffle);renderQueue();if(S.view.kind==="pl")renderMid();}
function cycleRepeat(){S.repeat=S.repeat==="off"?"all":S.repeat==="all"?"one":"off";$("btnRepeat").classList.toggle("on",S.repeat!=="off");$("rep1").hidden=S.repeat!=="one";$("btnRepeat").title="반복: "+{off:"끔",all:"전체",one:"한 곡"}[S.repeat];renderQueue();if(S.view.kind==="pl")renderMid();}
$("btnShuffle").onclick=toggleShuffle;$("btnRepeat").onclick=cycleRepeat;
$("btnQueue").onclick=()=>{S.queueHidden=!S.queueHidden;renderQueue();};$("btnClearQueue").onclick=()=>{S.queue=[];S.order=[];S.qi=-1;renderQueue();};
function renderQueue(){const ord=qOrder(),pos=qPos();const up=ord.slice(pos+1).map((i)=>S.queue[i]);const remain=up.reduce((a,it)=>a+((S.byTitle.get(it.title)||{}).duration||0),0);
  $("queueN").textContent=up.length;$("queueMeta").textContent=S.queue.length?`${S.src.startsWith("pl:")?((S.lists.playlists.find((p)=>"pl:"+p.id===S.src)||{}).name||""):S.src==="view"?"현재 목록":"단일 재생"}${up.length?` · 남은 ${up.length}곡${remain?" · "+fmtSec(remain):""}`:""}${S.repeat!=="off"?" · 반복 "+{all:"전체",one:"한 곡"}[S.repeat]:""}${S.shuffle?" · 셔플":""}`:"";
  $("queueCard").hidden=!S.queue.length||!!S.queueHidden;
  const now=S.queue[S.qi];const lib=(t)=>S.byTitle.get(t)||{};
  $("queueBody").innerHTML=(now?`<div style="padding:9px 11px;border-radius:9px;border:1px solid var(--goldline);background:var(--goldwash);margin-bottom:6px"><div style="font-size:11px;color:var(--gold);letter-spacing:.08em">${S.playing?"재생 중":"현재"}</div><div style="font-weight:700;color:var(--strong)">${esc(lib(now.title).song||now.title)}</div><div style="font-size:11.5px;color:var(--ink2)">${esc(lib(now.title).artist||"")}${now.inst?" · "+esc(now.inst):" · 악기 그대로"}</div></div>`:"")+
    (up.length?up.slice(0,30).map((it,k)=>`<div style="display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 9px;border-radius:8px;border:1px solid var(--line2);margin-bottom:4px;cursor:pointer" data-qj="${ord[pos+1+k]}"><span class="num" style="font-size:11px;color:var(--faint);width:16px">${k+1}</span><div style="min-width:0"><div style="font-size:12.5px;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(lib(it.title).song||it.title)}</div><div style="font-size:11px;color:var(--muted)">${esc(lib(it.title).artist||"")}${it.inst?" · "+esc(it.inst):""}</div></div><span class="num" style="font-size:11px;color:var(--muted)">${lib(it.title).duration?fmtSec(lib(it.title).duration):""}</span></div>`).join("")+(up.length>30?`<div class="note" style="text-align:center">+ ${up.length-30}곡</div>`:""):`<div class="note" style="padding:4px 2px">다음 곡 없음</div>`);
  $("queueBody").querySelectorAll("[data-qj]").forEach((n)=>n.onclick=()=>{if(S.switching)return;clearTimeout(S.gapT);S.gapT=null;playIndex(Number(n.dataset.qj));});}

function renderLog(){const L=S.logs||[];$("logMeta").textContent=L.length?`최근 ${Math.min(L.length,40)}건`:"";
  $("logBody").innerHTML=L.length?L.slice(0,40).map((l,i)=>`<div class="log ${l.ok?(i===0?"ok":""):"warn"}" data-li="${i}"><span class="ts">${fmtClock(l.ts)}</span><span class="msg"><span>${esc(l.summary||l.command)}</span><small>${esc(l.command)}${l.error?" · "+esc(l.error):""} · ${l.elapsed}s${l.message?" · "+esc(l.message):""}</small></span><span class="st">${l.ok?"성공":"주의"}</span></div>${S.rawOpen===l.ts?`<div class="raw" style="margin:-2px 0 6px">${esc(l.raw)}</div>`:""}`).join(""):`<div class="empty">아직 없음</div>`;
  $("logBody").querySelectorAll("[data-li]").forEach((n)=>n.onclick=()=>{const ts=L[Number(n.dataset.li)].ts;S.rawOpen=S.rawOpen===ts?-1:ts;renderLog();});}

/* ── 아티스트·재생목록 조작 ── */
function assignMenu(e,titles){const arts=S.summary.artists||[],manual=arts.filter((a)=>a.manual),auto=arts.filter((a)=>!a.manual);const it=titles.length===1?S.byTitle.get(titles[0]):null;
  const items=[[`${titles.length}곡 → 아티스트 지정`,null]];
  if(it&&it.artist&&it.song)items.push([`뒤집기: 「${it.song}」을 아티스트로`,async()=>{await api("/api/artists",{op:"assign",titles,name:it.song});S.selected.clear();await loadAll();}]);
  if(it&&!it.artist){const first=(it.song||it.cleaned).split(/\s+/)[0];if(first&&first.length>=2&&first!==it.song)items.push([`첫 단어 「${first}」 → 아티스트로`,async()=>{await api("/api/artists",{op:"assign",titles,name:first});S.selected.clear();await loadAll();}]);}
  items.push(["+ 새 아티스트…",async()=>{const name=await ask("아티스트 이름",it&&it.artist?it.artist:"");if(!name)return;await api("/api/artists",{op:"assign",titles,name});S.selected.clear();await loadAll();}]);
  if(manual.length)items.push(["— 등록된 아티스트 —",null]);manual.forEach((a)=>items.push([`★ ${a.name} (${a.count})`,async()=>{await api("/api/artists",{op:"assign",titles,id:a.key});S.selected.clear();await loadAll();}]));
  if(auto.length)items.push(["— 자동 추출 (지정하면 등록) —",null]);auto.slice(0,40).forEach((a)=>items.push([`· ${a.name} (${a.count})`,async()=>{await api("/api/artists",{op:"assign",titles,name:a.name});S.selected.clear();await loadAll();}]));
  items.push(["지정 해제",async()=>{await api("/api/artists",{op:"unassign",titles});S.selected.clear();await loadAll();}]);menu(e,items);}
function artistMenu(e,key){const a=(S.summary.artists||[]).find((x)=>x.key===key);if(!a)return;const titlesOf=async()=>S.all.filter((i)=>i.artistKey===key).map((i)=>i.title);
  menu(e,[[a.name,null],[a.manual?"이름 변경":"정식 아티스트로 등록",async()=>{const name=await ask(a.manual?"이름 변경":"정식 등록",a.name);if(!name)return;if(a.manual)await api("/api/artists",{op:"rename",id:key,name});else await api("/api/artists",{op:"assign",titles:await titlesOf(),name});await loadAll();}],
    ["별칭 추가",async()=>{if(!a.manual){alert("먼저 정식 아티스트로 등록하세요");return;}const al=await ask(`「${a.name}」의 별칭 (예: IU, 방탄소년단)`);if(!al)return;await api("/api/artists",{op:"alias",id:key,alias:al});await loadAll();}],
    ["다른 아티스트에 합치기",()=>{const targets=(S.summary.artists||[]).filter((x)=>x.manual&&x.key!==key);if(!targets.length){alert("합칠 정식 아티스트가 없습니다 (먼저 하나를 등록하세요)");return;}menu(e,[[`「${a.name}」 → 다음 아티스트로`,null]].concat(targets.map((t)=>[`★ ${t.name}`,async()=>{if(a.manual)await api("/api/artists",{op:"merge",from:key,into:t.key});else{await api("/api/artists",{op:"assign",titles:await titlesOf(),id:t.key});await api("/api/artists",{op:"alias",id:t.key,alias:a.name});}if(S.view.kind==="artist")S.view={kind:"artist",key:t.key};await loadAll();}])));}],
    ...(a.manual?[["삭제(지정 해제)",async()=>{if(!confirm(`「${a.name}」 등록을 지우고 지정을 해제할까요?`))return;await api("/api/artists",{op:"delete",id:key});if(S.view.kind==="artist")S.view={kind:"lib"};await loadAll();}]]:[])]);}
function addMenu(e,titles){const pls=S.lists.playlists;menu(e,[[`${titles.length}곡 담기`,null]].concat(pls.map((p)=>[`♪ ${p.name} (${p.items.length})`,async()=>{await listsApi({op:"add",id:p.id,titles});S.selected.clear();render();}])).concat([["+ 새 재생목록에",()=>newList(null,titles)]]));}

async function renameFolder(id){const f=S.lists.folders.find((x)=>x.id===id);const name=await ask("폴더 이름",f.name);if(name===null)return;await listsApi({op:"folder_rename",id,name});renderTree();}
async function delPl(id){if(!confirm("이 재생목록을 삭제할까요?"))return;await listsApi({op:"delete",id});if(S.view.kind==="pl"&&S.view.id===id)S.view={kind:"lib"};render();}
async function delFolder(id){if(!confirm("폴더를 삭제할까요? (안의 목록은 상위로 옮겨집니다)"))return;await listsApi({op:"folder_delete",id});renderTree();}
function movePl(id){menu({clientX:280,clientY:140},[["(폴더 없음)",async()=>{await listsApi({op:"move",id,folder:null});render();}]].concat(S.lists.folders.map((f)=>[f.name,async()=>{await listsApi({op:"move",id,folder:f.id});render();}])));}
$("btnNewList").onclick=()=>newList(null);$("btnNewFolder").onclick=()=>newFolder(null);

/* ── 테마: 자동(OS) / 다크 / 라이트 ── */
const THEME_KEY="mobifolio.theme",THEME_ORDER=["auto","dark","light"],THEME_LABEL={auto:"자동",dark:"다크",light:"라이트"};
const sysDark=()=>window.matchMedia("(prefers-color-scheme: dark)").matches;
function readTheme(){try{const t=localStorage.getItem(THEME_KEY);return t==="dark"||t==="light"?t:"auto";}catch{return "auto";}}
let themeForced=document.documentElement.getAttribute("data-theme")||"";   // 서버가 ?theme= 으로 고정한 값 (검토용) — 사용자가 버튼을 누르면 해제
function applyTheme(t){const root=document.documentElement;if(t==="auto"){if(themeForced)root.setAttribute("data-theme",themeForced);else root.removeAttribute("data-theme");}else root.setAttribute("data-theme",t);
  try{if(t==="auto")localStorage.removeItem(THEME_KEY);else localStorage.setItem(THEME_KEY,t);}catch{}
  const b=$("themeBtn");b.textContent="테마: "+THEME_LABEL[t];b.title=t==="auto"?`OS 설정을 따릅니다 (지금 ${sysDark()?"다크":"라이트"}). 눌러서 고정하세요.`:`${THEME_LABEL[t]}로 고정했습니다. 눌러서 바꾸세요.`;}
applyTheme(readTheme());
$("themeBtn").onclick=()=>{themeForced="";const i=THEME_ORDER.indexOf(readTheme());applyTheme(THEME_ORDER[(i+1)%THEME_ORDER.length]);};
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(readTheme()==="auto")applyTheme("auto");});

/* ── 갱신·보고·설정 ── */
$("btnSync").onclick=async()=>{const b=$("btnSync"),html=b.innerHTML;b.disabled=true;b.innerHTML=ICON("refresh","s")+"갱신 중…";
  try{const r=await api("/api/sync",{});await refreshState();await loadAll();await loadLog();if(!r.ok){const bad=(r.steps||[]).find((s)=>!s.ok||s.error)||{};toast("갱신 실패: "+(bad.error||r.error||"")+" "+(bad.message||r.message||""));}}
  finally{b.disabled=false;b.innerHTML=html;}};
$("btnReport").onclick=async()=>{const d=await api("/api/normalize");const s=d.summary;$("repMeta").textContent=`${s.count}곡 · 인식 ${s.count-s.other} · 기타 ${s.other}`;$("repBody").textContent=d.rows.map((r)=>`${r.bucket==="other"?"기타":"인식"} ${r.rule.padEnd(6)} | ${r.title}\n      → 아티스트 [${r.artist}] 곡 [${r.song}]${r.variant?` 변형 ${r.variant}`:""}${r.tags.length?` 태그 ${r.tags.join(",")}`:""}${r.removed.length?` 제거 ${r.removed.join(" ")}`:""}`).join("\n");$("rep").showModal();};
let sInst="";
$("btnSettings").onclick=async()=>{const d=await api("/api/settings");const s=d.settings;$("sCli").value=s.cli_exe||"";$("sGap").value=s.gap_sec;$("sMargin").value=s.advance_margin;$("sStop").checked=!!s.stop_before_play;$("sAuto").checked=!!s.auto_sync;sInst=s.default_inst||"";
  ddMake($("sInstDd"),instItemsSet,()=>sInst,(v)=>{sInst=v;});$("sCliHint").textContent=cliHint(d.cli);$("set").showModal();$("sCli").focus();};
const cliHint=(c)=>!c?"—":c.found?`감지된 경로: ${c.exe} · ${c.pipe==="connected"?"연결됨":"끊김 "+(c.reason||c.status_error||"")}${c.override_invalid?" · 설정한 경로가 없어 기본 경로를 씁니다":""}`:"실행파일을 찾지 못했습니다";
$("sSave").onclick=async()=>{const r=await api("/api/settings",{settings:{cli_exe:$("sCli").value.trim(),gap_sec:Number($("sGap").value)||0,advance_margin:Number($("sMargin").value)||0,default_inst:sInst,stop_before_play:$("sStop").checked,auto_sync:$("sAuto").checked}});
  if(!r.ok){$("sCliHint").textContent="저장 실패: "+(r.message||r.error||"");return;}S.settings=r.settings;$("sCliHint").textContent=cliHint(r.cli);$("set").close();await refreshState();$("instDd")._refresh&&$("instDd")._refresh();renderMid();};
$("sTest").onclick=async()=>{$("sCliHint").textContent="확인 중…";const d=await api("/api/cli_test",{cli_exe:$("sCli").value.trim()});$("sCliHint").textContent=d.ok?cliHint(d.cli):"확인 실패: "+(d.message||d.error||"");};

/* ── 시작 ── */
(async()=>{ddMake($("instDd"),instItems,()=>S.instrument,(v)=>{S.instrument=v;});const st=await refreshState();await loadAll();await loadLog();
  if(S.settings.auto_sync&&S.cliOk){$("btnSync").click();}
  if(S.cliOk){const a=await api("/api/activity");const p=a&&a.ok&&a.body&&a.body.Performance;
    if(p&&p.IsPlaying){S.now={title:"",inst:p.InstrumentName||"",song:p.MusicTitle||"",artist:""};S.playing=true;S.startedAt=Date.now()-(p.ElapsedSeconds||0)*1000;S.gen=(S.gen||0)+1;
      $("nowTitle").textContent=p.MusicTitle||"게임에서 재생 중";$("nowSub").textContent="게임에서 재생 중 · "+(p.InstrumentName||"");setMain(true);startPoll();}}
  setInterval(refreshState,15000);setInterval(loadLog,6000);})();
</script>
